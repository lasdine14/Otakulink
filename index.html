<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b1f"><title>OtakuLink</title>
<style>
:root{--bg:#050b1f;--c:#0a1334;--c2:#101d45;--b:#1e90ff;--cy:#22d3ee;--t:#eaf1ff;--m:#8fa3d6;--l:rgba(60,130,255,.42);--g:0 0 14px rgba(30,144,255,.38),inset 0 0 16px rgba(30,144,255,.08);--r:#ef2b3d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#02050f}
body{font:15px/1.4 "Segoe UI",Roboto,system-ui,sans-serif;color:var(--t);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--t)}a{color:var(--cy);text-decoration:none}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#app{height:100dvh;max-width:440px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
background:radial-gradient(500px 300px at 90% -5%,rgba(60,100,255,.3),transparent 60%),radial-gradient(500px 400px at -10% 105%,rgba(30,144,255,.25),transparent 60%),var(--bg);box-shadow:0 0 0 1px var(--l),0 0 40px rgba(30,144,255,.25)}
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--l)}
#top h1{flex:1;text-align:center;font-size:18px;font-weight:700}
.ib{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--l);background:var(--c);box-shadow:var(--g)}
.ib.ph{visibility:hidden}.dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--r)}
#scr{flex:1;overflow-y:auto;padding:14px;position:relative}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0);border-top:1px solid var(--l);background:rgba(5,11,31,.96)}
#tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--m);font-size:11px}
#tabs a.on{color:var(--b);text-shadow:0 0 10px rgba(30,144,255,.8)}#tabs a.on svg{filter:drop-shadow(0 0 5px var(--b))}
.bd{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--r);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bd.i{position:static;display:inline-grid;margin-left:6px}
/* auth */
body.auth #top,body.auth #tabs{display:none}body.auth #scr{padding:0}
.aw{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:22px 22px 26px;text-align:center;position:relative;z-index:1}
.aw.f{justify-content:center}
.bg{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 70% 16%,#cfe6ff 0 7%,#6fb1ff 8% 11%,rgba(60,130,255,.35) 12% 28%,transparent 45%),linear-gradient(180deg,rgba(5,11,31,0) 30%,var(--bg) 85%)}
.bg svg{position:absolute;right:-30px;bottom:0;width:240px;opacity:.28}
.logo{display:flex;flex-direction:column;align-items:center}.logo svg{filter:drop-shadow(0 0 8px var(--cy))}
.logo b{font-size:36px;font-weight:800;letter-spacing:-.5px}.logo b span{color:var(--cy)}
.tag{font-size:21px;font-weight:700;line-height:1.25}.tag span{color:var(--cy)}.sub{color:var(--m)}
.field{display:flex;align-items:center;gap:10px;background:var(--c);border:1px solid var(--l);border-radius:14px;padding:0 14px;height:50px;text-align:left}
.field input,.field select{flex:1;min-width:0;height:100%;background:none;border:0;outline:0}.field select option{background:var(--c)}
.field:focus-within{border-color:var(--b);box-shadow:var(--g)}.field svg{color:var(--m);flex:none}
.ck{display:flex;gap:10px;align-items:center;text-align:left;font-size:13px}.ck input{accent-color:var(--b);width:18px;height:18px}
.btn{display:block;width:100%;height:50px;border-radius:999px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(90deg,#1e90ff,#00c2ff);box-shadow:0 0 18px rgba(30,144,255,.5);line-height:50px;text-align:center}
.btn.d{background:#000;border:1px solid var(--l);box-shadow:none}.btn:disabled{opacity:.6}
.sep{display:flex;align-items:center;gap:12px;color:var(--m);font-size:13px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--l)}
.soc{display:flex;gap:12px;justify-content:center}.soc button{flex:1;max-width:96px;height:48px;border-radius:14px;border:1px solid var(--l);background:var(--c);font-weight:700}
.note{min-height:18px;font-size:13px;color:var(--cy)}.row{display:flex;justify-content:space-between;font-size:13px}
/* app */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;padding:7px 16px;border-radius:999px;border:1px solid var(--l);background:var(--c);font-size:14px}
.chips button.on{background:var(--b);border-color:var(--b);box-shadow:0 0 12px rgba(30,144,255,.6)}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:14px;box-shadow:var(--g);margin-bottom:12px}
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;overflow:hidden;border:2px solid var(--b);box-shadow:var(--g);color:#fff}
.av img{width:100%;height:100%;object-fit:cover}.av.ring{border-width:3px;box-shadow:0 0 22px var(--b)}
.cmp{display:flex;align-items:center;gap:10px}.cmp input[type=text]{flex:1;min-width:0;background:none;border:0;outline:0}
.cmp .btn{width:auto;height:36px;line-height:36px;padding:0 18px;font-size:14px}.ir{color:var(--m);display:grid;place-items:center}
.pv{margin-top:10px;border-radius:12px;max-height:160px;object-fit:cover;width:100%}
.ph2{display:flex;gap:10px;align-items:center}.ph2 .g{flex:1;min-width:0}.g{flex:1;min-width:0}
.po p{margin:10px 0;white-space:pre-wrap;word-break:break-word}
.art{height:170px;border-radius:14px;display:grid;place-items:center;font-size:64px;margin-bottom:10px}
.art.img{padding:0;display:block;overflow:hidden}.art.img img{width:100%;height:100%;object-fit:cover}
.act{display:flex;gap:18px;align-items:center;color:var(--m);font-size:14px}.act button{display:flex;gap:6px;align-items:center}.act .on{color:var(--r)}
.cm{margin-top:8px;font-size:13px;color:var(--m)}.cm b{color:var(--t)}
.pers{display:flex;align-items:center;gap:12px;padding:12px}
.mini{width:38px;height:38px;border-radius:12px;border:1px solid var(--l);background:var(--c2);display:grid;place-items:center;margin-left:4px}
.mini.y{background:var(--b)}.mini.n{color:var(--r)}
.bubble{position:absolute;top:8px;left:0;right:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gc{text-align:center;padding:14px 8px;margin:0}.gc .av{margin:0 auto 6px}
.st{font-size:12px;color:var(--m)}.st i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ee66b;margin-right:4px}.st i.o{background:var(--r)}
.dc{position:relative;height:min(52vh,420px);border-radius:22px;border:1px solid var(--l);box-shadow:var(--g);overflow:hidden;display:flex;align-items:flex-end}
.dc .ov{position:relative;width:100%;padding:60px 16px 14px;background:linear-gradient(0deg,rgba(5,11,31,.95) 40%,transparent)}
.dc h2{font-size:24px}.cnt{position:absolute;top:12px;right:12px;padding:4px 12px;border-radius:999px;background:rgba(5,11,31,.7);border:1px solid var(--l);font-size:13px}
.big{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;opacity:.9}.big img{width:100%;height:100%;object-fit:cover}
.tg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tg span{padding:5px 14px;border-radius:999px;border:1px solid var(--l);background:rgba(16,29,69,.8);font-size:13px}
.rd{display:flex;justify-content:center;gap:22px;margin-top:16px}.rd button{width:58px;height:58px;border-radius:50%;border:2px solid var(--b);background:var(--c);display:grid;place-items:center;box-shadow:var(--g)}.rd .h{background:var(--b)}
.empty{text-align:center;padding:34px 18px}.empty .e{font-size:40px;margin-bottom:6px}.empty p{color:var(--m)}
.msg{max-width:78%;padding:9px 14px;border-radius:18px;background:var(--c2);margin:6px 0;word-break:break-word}.msg.me{margin-left:auto;background:var(--b)}
#fm{position:sticky;bottom:-14px;display:flex;gap:8px;padding:8px 0 4px;background:var(--bg)}
#fm input{flex:1;height:46px;border-radius:999px;border:1px solid var(--l);background:var(--c);padding:0 16px;outline:0;min-width:0}#fm button{width:46px;border-radius:50%;background:var(--b);display:grid;place-items:center}
.pf{text-align:center}.pf .av{margin:0 auto 8px}.stats{display:flex;justify-content:space-around;margin:14px 0 4px}.stats b{display:block;font-size:20px}.stats span{color:var(--m);font-size:13px}
.h2{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px;font-weight:700}.h2 a{font-weight:400;font-size:13px}
.an{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.an div{aspect-ratio:3/4;border-radius:12px;border:1px solid var(--l);display:flex;align-items:flex-end;padding:5px;font-size:11px;font-weight:700;word-break:break-word}
.mn{display:flex;align-items:center;gap:14px;padding:13px 6px;width:100%;text-align:left;border-bottom:1px solid rgba(60,130,255,.15)}
.mn svg{color:var(--cy)}.gp{margin:16px 4px 4px;font-weight:700}
.sw{width:44px;height:26px;border-radius:13px;background:var(--c2);border:1px solid var(--l);position:relative;margin-left:auto}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--m);transition:.2s}.sw.on{background:var(--b)}.sw.on::after{left:20px;background:#fff}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--c2);border:1px solid var(--b);box-shadow:var(--g);padding:10px 18px;border-radius:999px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.sq{margin-bottom:12px}
</style></head><body>
<div id="app">

<script>

ath d="M12 11v6M12 7.5v.5"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const TORII='<svg width="64" height="52" viewBox="0 0 64 52" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c14 4 42 4 56 0"/><path d="M10 20h44"/><path d="M16 10v38M48 10v38"/><path d="M32 12v8"/></svg>';

const PAYS=["France","Congo","Gabon","Cameroun","Côte d’Ivoire","Sénégal","Belgique","Canada","Autre"];
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s),scr=$("#scr");
const T=["Anime","Manga","Jeux vidéo"],now=Date.now();
const BOTS=[["Miyu_Chan","Fan de Naruto, Demon Slayer et de Jujutsu Kaisen 💙","France",1],["KonohaDream","Naruto forever 🔥","France",1],["LuffySenpai","Futur roi des pirates 🏴‍☠️","Congo",1],["HinataLove","Rêveuse et discrète","Gabon",0],["NarutoFan93","Dattebayo !","Cameroun",1],["AnimeWorld","Groupe officiel des otakus","—",1,1],["SakuraDream","Cerisiers et manga","Belgique",1],["OnePieceCrew","Club One Piece ⚓","Canada",1],["AnimeFan_24","Debats animés","France",1],["Yuki_San","Fan de slice of life","Sénégal",1],["Akira_Dev","Dev le jour, otaku la nuit","France",0],["Mikasa_FR","Attack on Titan à fond","France",1],["Zoro_Fan","Je me perds souvent 😅","Gabon",1],["Nezuko_Love","Demon Slayer 💗","Côte d’Ivoire",1],["Gojo_Satoru","Le plus fort. Point.","Canada",0],["Hana_Otaku","Shōjo et thé","Belgique",1],["Levi_Main","Propre et efficace","France",1],["Rem_Chan","Team Rem","Cameroun",1]];
const REPL=["Haha oui !! 😄","Trop bien, raconte !","On regarde ça ce soir ?","Dattebayo ! 🔥","Carrément d’accord 💙","Tu as vu le dernier épisode ?","Je t’envoie ma liste de recos 📚"];
const mk=(t,m,ago)=>({m,t,ts:now-ago});
function seed(){const u={};BOTS.forEach((b,i)=>u["b"+i]={id:"b"+i,pseudo:b[0],bio:b[1],pays:b[2],on:b[3],g:b[4]||0,animes:T});
return{users:u,acc:[],me:null,d:{},posts:[
{id:"p1",u:"b8",t:"Top 3 des animes de tous les temps ?\n1. One Piece\n2. Naruto\n3. Demon Slayer",img:"art:38:🏴‍☠️",cat:"Débats",n:552,l:[],cn:189,c:[],sh:72,ts:now-36e5},
{id:"p2",u:"b1",t:"Quel est votre anime préféré ?\nMoi c’est Naruto ! 😆🔥",img:"art:28:🍥",cat:"Animes",n:428,l:[],cn:124,c:[],sh:67,ts:now-72e5},
{id:"p3",u:"b5",t:"Découvrez notre nouveau club : One Piece ! ⚓",img:"art:205:🌊",cat:"Clubs",n:231,l:[],cn:40,c:[],sh:12,ts:now-108e5}]}}

let ui={f:null,sq:0,q:"",pt:"",pi:null};

const artS=h=>`background:radial-gradient(circle at 78% 24%,rgba(255,255,255,.9) 0 5%,transparent 6%),linear-gradient(150deg,hsl(${h} 80% 45%),hsl(${+h+55} 70% 16%))`;
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2400)}
function initD(){S.d[S.me]={rel:{b0:"ami",b1:"ami",b2:"ami",b3:"ami",b4:"ami",b6:"recu",b7:"recu"},fav:[],pass:[],seen:0,un:{b0:2},set:{notif:1,priv:0,acc:0},
msgs:{b0:[mk("À bientôt ! 💙",0,3e5)],b4:[mk("On regarde quoi ? 😊",0,6e5)],b5:[mk("Bienvenue sur le groupe !",0,864e5)],b6:[mk("Super ! 👍",0,9e7)],b7:[mk("🔥",0,17e7)]}}}
const D0=()=>{const d=D();document.documentElement.style.setProperty("--b",["#1e90ff","#8b5cf6","#06b6d4"][d.set.acc||0])};
