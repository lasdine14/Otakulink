`;
document.head.appendChild(opStyle);


/* Mélange équitable (Fisher-Yates) */
function opShuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

/* ===== Bandes-annonces ===== */
function opYtId(x){
 const t=x&&x.trailer;if(!t)return '';
 let id=t.youtube_id||'';
 if(!id){const m=String(t.embed_url||t.url||'').match(/(?:embed\/|v=|youtu\.be\/)([\w-]{6,15})/);if(m)id=m[1];}
 return /^[\w-]{6,15}$/.test(id)?id:'';
}
function opOpenTrailer(title,yt){
 const search='https://www.youtube.com/results?search_query='+encodeURIComponent((title||'')+' bande annonce officielle');
 const player=/^[\w-]{6,15}$/.test(yt||'')
  ?`<div style="position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden"><iframe src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0&playsinline=1" title="Bande-annonce" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div><p class="op-note" style="margin-top:12px">La vidéo ne se lance pas ? <a class="op-external" href="https://www.youtube.com/watch?v=${yt}" target="_blank" rel="noopener">Ouvrir sur YouTube ↗</a></p>`
  :`<div style="text-align:center;padding:30px 10px"><div style="font-size:56px">🎬</div><p style="font-size:17px;line-height:1.5;margin:12px 0 18px">Pas de bande-annonce directe pour cette œuvre. Cherche la vidéo officielle sur YouTube.</p><a class="btn" href="${search}" target="_blank" rel="noopener" style="display:inline-block;padding:15px 24px">▶ Chercher sur YouTube</a></div>`;
 $('#modal-root').innerHTML=`<div class="modal" id="op-trailer-modal" style="align-items:center;padding:12px"><div class="sheet" style="max-width:720px;width:100%;border-radius:18px;padding:16px 16px 18px;background:linear-gradient(160deg,#071a3b,#030b20)"><div style="display:flex;align-items:center;gap:10px;padding-bottom:12px"><b style="font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere">🎬 ${esc(title||'Bande-annonce')}</b><button type="button" class="icon-btn" id="op-trailer-x" aria-label="Fermer">✕</button></div>${player}</div></div>`;
 const close=()=>{$('#modal-root').innerHTML='';};
 $('#op-trailer-x').onclick=close;
 $('#op-trailer-modal').onclick=e=>{if(e.target.id==='op-trailer-modal')close();};
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-op-trailer]');if(!b)return;e.preventDefault();e.stopPropagation();opOpenTrailer(b.dataset.opTitle,b.dataset.opYt);},true);


/* ===== Où regarder / lire (sources officielles) ===== */
function opOpenWhere(title,kind){
 const q=encodeURIComponent(title||''),isAnime=String(kind||'Anime')==='Anime';
 const rows=isAnime?[
  ['🟠','Crunchyroll','Catalogue officiel d’anime en streaming','https://www.crunchyroll.com/search?q='+q],
  ['🔴','Netflix','Séries et films d’animation','https://www.netflix.com/search?q='+q],
  ['🇫🇷','ADN','Plateforme française dédiée à l’anime (VOSTFR et VF)','https://animationdigitalnetwork.com/'],
  ['🔵','Prime Video','Séries et films d’animation','https://www.primevideo.com/search?phrase='+q],
  ['▶️','YouTube (chaînes officielles)','Épisodes gratuits proposés par les studios','https://www.youtube.com/results?search_query='+q+'+episode+officiel']
 ]:[
  ['🟥','MANGA Plus','Chapitres officiels gratuits (Shueisha)','https://mangaplus.shueisha.co.jp/'],
  ['🟩','WEBTOON','Lecture officielle, beaucoup de séries gratuites','https://www.webtoons.com/fr/search?keyword='+q],
  ['📚','Acheter les tomes','Librairies et éditeurs officiels','https://www.google.com/search?q='+q+'+manga+acheter+tome+officiel']
 ];
 $('#modal-root').innerHTML=`<div class="modal" id="op-where-modal" style="align-items:center;padding:12px"><div class="sheet" style="max-width:560px;width:100%;border-radius:18px;padding:16px 16px 18px;background:linear-gradient(160deg,#071a3b,#030b20)"><div style="display:flex;align-items:center;gap:10px;padding-bottom:6px"><b style="font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere">${isAnime?'📺 Où regarder':'📖 Où lire'} · ${esc(title||'')}</b><button type="button" class="icon-btn" id="op-where-x" aria-label="Fermer">✕</button></div><p class="op-note" style="margin:0 0 12px">Sources officielles uniquement.</p>${rows.map(r=>`<a href="${esc(r[3])}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:14px;margin:0 0 10px;padding:14px;border:1.5px solid #1b9aff66;border-radius:16px;background:#0d1b3f;color:#fff;text-decoration:none"><span style="font-size:28px">${r[0]}</span><span style="flex:1"><b style="display:block;font-size:17px">${esc(r[1])}</b><small style="color:#9fb4d9">${esc(r[2])}</small></span><span>↗</span></a>`).join('')}<p class="op-note" style="margin-top:8px">La disponibilité change selon ton pays et ton abonnement.</p></div></div>`;
 const close=()=>{$('#modal-root').innerHTML='';};
 $('#op-where-x').onclick=close;
 $('#op-where-modal').onclick=e=>{if(e.target.id==='op-where-modal')close();};
}

/* ===== Suivi de progression ===== */
async function opAwardProgress(){
 try{
  if(!state.client||!state.user)return;
  const {data,error}=await state.client.rpc('otaku_plus_progress_xp');
  if(error)throw error;
  const earned=Number(data)||0;
  if(earned>0){
   const {data:row}=await state.client.from('otaku_plus_xp').select('xp').eq('user_id',state.user.id).maybeSingle();
   if(row)opServerXp=Number(row.xp)||0;
   const pill=document.querySelector('#s-otakuplus .op-xp-pill');if(pill)pill.textContent='⚡ '+opServerXp+' XP';
   toast('+'+earned+' XP · Progression mise à jour');
  }
 }catch(_){/* le SQL v2 n'est peut-être pas encore installé : on ignore */}
}
function opUpdateFav(id,kind,patch){
 const d=otPlusData(),i=(d.favorites||[]).findIndex(v=>String(v.id)===String(id)&&v.kind===kind);
 if(i<0)return null;
 d.favorites[i]={...d.favorites[i],...patch};otPlusSet(d);return d;
}
document.addEventListener('click',e=>{
 const w=e.target.closest&&e.target.closest('[data-op-where]');
 if(w){e.preventDefault();e.stopPropagation();opOpenWhere(w.dataset.opTitle,w.dataset.opKind);return;}
 const pub=e.target.closest&&e.target.closest('[data-op-list-public]');
 if(pub){e.preventDefault();e.stopPropagation();const d=otPlusData();d.listPublic=d.listPublic===false;otPlusSet(d);pub.textContent=d.listPublic!==false?'👁 Visible sur mon profil':'🙈 Cachée sur mon profil';toast(d.listPublic!==false?'Ta liste est visible sur ton profil.':'Ta liste est cachée.');return;}
 const pr=e.target.closest&&e.target.closest('[data-op-prog]');
 if(pr){
  e.preventDefault();e.stopPropagation();
  const box=pr.closest('[data-op-track]');if(!box)return;
  const id=box.dataset.opTrack,kind=box.dataset.opKind,delta=Number(pr.dataset.opProg)||0;
  const f=(otPlusData().favorites||[]).find(v=>String(v.id)===String(id)&&v.kind===kind);if(!f)return;
  const n=Math.max(0,Math.min(9999,(Number(f.progress)||0)+delta));
  const patch={progress:n};
  if(n>0&&(f.status||'À voir')==='À voir')patch.status='En cours';
  const d=opUpdateFav(id,kind,patch);if(!d)return;
  box.querySelector('[data-op-prog-label]').textContent=(kind==='Manga'?'Chapitre ':'Épisode ')+n;
  if(patch.status)box.querySelector('[data-op-status]').value=patch.status;
  const today=otPlusToday();
  if(delta>0&&d.progressXpDay!==today){const d2=otPlusData();d2.progressXpDay=today;otPlusSet(d2);opAwardProgress();}
 }
},true);
document.addEventListener('change',e=>{
 const sel=e.target.closest&&e.target.closest('[data-op-status]');if(!sel)return;
 const box=sel.closest('[data-op-track]');if(!box)return;
 opUpdateFav(box.dataset.opTrack,box.dataset.opKind,{status:sel.value});toast('Statut : '+sel.value);
},true);

/* ===== DÉFI DES 60 JOURS ===== */
let opDefiDay=0,opDefiReplay=false,opDefiServer=false;
const OD_PASS=4;
const OD_THEMES=[['Naruto','🍥'],['One Piece','🏴‍☠️'],['Dragon Ball','🐉'],['Demon Slayer','🗡️'],['L’Attaque des Titans','⚔️'],['My Hero Academia','💥'],['Jujutsu Kaisen','👁️'],['Classiques','📺'],['Ghibli et films','🎬'],['Culture japonaise','🎌'],['Anime récents','🔥'],['Légende','👑']];
const OD_LEVELS=['Facile','Facile','Moyen','Difficile','Expert'];
const opLocalDay=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');};
const opDefiXp=day=>20+Math.round((day-1)*40/59)+(day%10===0?(day===60?150:50):0);
const opDefiTitle=day=>OD_THEMES[Math.floor((day-1)/5)][0];
async function opDefiLoad(){
 if(!state.client||!state.user)return {error:'Reconnecte-toi à ton compte.'};
 try{
  const {data,error}=await state.client.rpc('otaku_plus_defi_state');
  if(error)throw error;
  const done=(data&&data.done)||[];
  return {done,lastDate:(data&&data.last_date)||'',best:(data&&data.best)||{},canPlay:!!(data&&data.can_play)&&done.length<60};
 }catch(err){return {error:String(err?.message||err)};}
}
async function opDefiComplete(day){
 const {data,error}=await state.client.rpc('otaku_plus_defi_complete',{p_day:day});
 if(error)throw error;
 try{const {data:row}=await state.client.from('otaku_plus_xp').select('xp').eq('user_id',state.user.id).maybeSingle();if(row)opServerXp=Number(row.xp)||0;}catch(_){}
 return {xp:Number(data.xp)||0};
}
function opQuizModal(title){
 $('#modal-root').innerHTML=`<div class="modal" id="op-quiz-modal" style="align-items:stretch;padding:0"><div class="sheet" style="max-width:none;width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;border:0;display:flex;flex-direction:column;padding:16px 18px 20px;background:linear-gradient(160deg,#071a3b,#030b20)"><div style="display:flex;align-items:center;gap:10px;padding-bottom:12px"><b style="font-size:20px">${esc(title)}</b><span style="flex:1"></span><button type="button" class="icon-btn" id="op-quiz-x" aria-label="Fermer">✕</button></div><div id="op-quiz-area" style="flex:1;display:flex;flex-direction:column;min-height:0"></div></div></div>`;
 $('#op-quiz-x').onclick=()=>{$('#modal-root').innerHTML='';opDefiDay=0;if($('#s-otakuplus')?.dataset.opTab==='defi')renderOtakuPlus();};
}
async function opDefiPlay(day,replay){
 opDefiDay=day;opDefiReplay=!!replay;
 opQuizModal('📆 Jour '+day+' · '+opDefiTitle(day));
 const host=$('#op-quiz-area');
 host.innerHTML='<div style="flex:1;display:grid;place-items:center;text-align:center;color:#cfe3ff;font-size:18px">Préparation du quiz…</div>';
 try{
  if(!state.client||!state.user)throw new Error('Reconnecte-toi à ton compte.');
  const {data,error}=await state.client.rpc('otaku_plus_defi_start',{p_day:day});
  if(error)throw error;
  const qs=(data&&data.questions)||[];
  if(!qs.length)throw new Error('Questions indisponibles.');
  otPlusQuestions=qs.map(x=>({q:x.q,o:x.options,idx:x.idx,server:true}));
  opQuizState={index:0,score:0,answers:[]};
  opShowQuestion();
 }catch(err){
  const m=String(err?.message||err);
  const missing=/function|schema cache|not find|404/i.test(m);
  host.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px"><div style="font-size:64px">⚠️</div><p style="font-size:18px;line-height:1.5;color:#cfe3ff;max-width:420px">${missing?'Le défi a besoin de la mise à jour Supabase (otakulink-v2.sql).':esc(m.slice(0,160))}</p><button type="button" id="od-close" class="btn" style="padding:15px 24px;font-size:16px">Fermer</button></div>`;
  $('#od-close').onclick=()=>{$('#modal-root').innerHTML='';opDefiDay=0;if($('#s-otakuplus')?.dataset.opTab==='defi')renderOtakuPlus();};
 }
}
async function opDefiFinish(){
 const host=$('#op-quiz-area');if(!host)return;
 const score=opQuizState.score,total=otPlusQuestions.length,day=opDefiDay,replay=opDefiReplay,pass=score>=OD_PASS;
 const box=(icon,msg,btns)=>{host.innerHTML=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px"><div style="font-size:72px">${icon}</div><h2 style="font-size:44px">${score}/${total}</h2><p style="font-size:18px;line-height:1.5;color:#cfe3ff;max-width:420px">${msg}</p><div>${btns}</div></div>`;};
 const B=(id,label,primary)=>`<button type="button" id="${id}" class="btn ${primary?'':'ghost'}" style="padding:15px 24px;font-size:16px;margin:6px">${label}</button>`;
 const close=()=>{$('#modal-root').innerHTML='';opDefiDay=0;if($('#s-otakuplus')?.dataset.opTab==='defi')renderOtakuPlus();};

async function opRenderDefi(panel){

 };

<script>
/* Préchargement non bloquant des écrans Amis et Communauté. */
function warmOtakuScreens(){
 if(!state.client||!state.user)return;
 const work=async()=>{
  for(const route of ['decouvrir','communaute']){
   if(state.route===route)continue;
   if(state.routeCache[route]&&Date.now()-state.routeCache[route]<30000)continue;
   try{await render[route]?.();const el=$('#s-'+route);if(el){el.dataset.loaded='true';state.routeCache[route]=Date.now();}}
   catch(err){console.warn('Préchargement '+route,err);}
  }
 };
 if(window.requestIdleCallback)requestIdleCallback(work,{timeout:1800});else setTimeout(work,1000);
}
const _goWithWarmup=go;
go=function(route){_goWithWarmup(route);if(route==='decouvrir'||route==='communaute')warmOtakuScreens();};
</script>

<div id="chat-media-viewer" aria-hidden="true">
 <div class="viewer-content">
  <div id="chat-viewer-media"></div>
  <div class="viewer-actions">
   <button type="button" id="chat-viewer-download">⬇ Télécharger</button>
   <button type="button" id="chat-viewer-close">✕ Fermer</button>
  </div>
 </div>
</div>
<script>
(()=>{
 let currentUrl='', currentKind='image', currentName='media';
 const viewer=document.getElementById('chat-media-viewer');
 const mediaHost=document.getElementById('chat-viewer-media');
 const close=()=>{viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');mediaHost.replaceChildren();};
 function openMedia(url,kind,name){
   if(!url)return;
   currentUrl=url;currentKind=kind||'image';currentName=name||'media';
   const el=document.createElement(currentKind==='video'?'video':'img');
   el.src=url;
   if(currentKind==='video'){el.controls=true;el.playsInline=true;el.autoplay=true;}
   else {el.alt='Média reçu';}
   mediaHost.replaceChildren(el);
   viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');
 }
 async function downloadCurrent(){
   if(!currentUrl)return;
   const btn=document.getElementById('chat-viewer-download');
   btn.disabled=true;btn.textContent='Téléchargement…';
   try{
     const response=await fetch(currentUrl);
     if(!response.ok)throw new Error('download');
     const blob=await response.blob(), objectUrl=URL.createObjectURL(blob);
     const a=document.createElement('a');a.href=objectUrl;a.download=currentName||('otakulink-media.'+(currentKind==='video'?'mp4':'jpg'));
     document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),1500);
     btn.textContent='✓ Téléchargé';
   }catch(_){
     const a=document.createElement('a');a.href=currentUrl;a.target='_blank';a.rel='noopener';a.download=currentName||'otakulink-media';a.click();
     btn.textContent='Ouvrir le média';
   }finally{setTimeout(()=>{btn.disabled=false;btn.textContent='⬇ Télécharger';},1800);}
 }
 document.addEventListener('click',e=>{
   const view=e.target.closest('[data-chat-view]');
   if(view){openMedia(view.dataset.chatView,view.dataset.kind,view.dataset.name);return;}
   const dl=e.target.closest('[data-chat-download]');
   if(dl){openMedia(dl.dataset.chatDownload,dl.dataset.kind,dl.dataset.name);downloadCurrent();return;}
   if(e.target===viewer||e.target.closest('#chat-viewer-close'))close();
   if(e.target.closest('#chat-viewer-download'))downloadCurrent();
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
})();
</script>
<script id="ol-extras">
/* ===== OtakuLink : ajouts repris de l'ancienne maquette (mot de passe, tags, sujets, groupes, stats, onglets) ===== */
(function(){
const Q=(s,r=document)=>r.querySelector(s), QA=(s,r=document)=>[...r.querySelectorAll(s)];
function after(obj,name,fn){const o=obj[name];if(!o)return;obj[name]=async function(){const r=await o.apply(this,arguments);try{await fn.apply(this,arguments);}catch(e){console.error(e);}return r;};}
const card=(id,html)=>{const c=document.createElement("div");c.className="card";c.id=id;c.innerHTML=html;return c;};

/* 2) Tags dans la création de publication */
const _oc=openComposer;
openComposer=function(){
  _oc.apply(this,arguments);
  const t=Q("#m-text");if(!t||Q("#ol-tags"))return;
  const d=document.createElement("div");d.id="ol-tags";d.className="chips";d.style.marginTop="8px";
  d.innerHTML=["Anime","Manga","Gaming","Cosplay","OtakuLife"].map(x=>`<button type="button" class="chip" data-tag="#${x}">#${x}</button>`).join("");
  t.insertAdjacentElement("afterend",d);
  d.onclick=e=>{const b=e.target.closest("[data-tag]");if(!b)return;t.value=(t.value+" "+b.dataset.tag).trim();t.dispatchEvent(new Event("input"));t.focus();};
};

/* 1) + 6) Paramètres : mot de passe + onglets Compte / Sécurité / Aide */
let curTab="compte";
after(render,"parametres",async()=>{
  const root=Q("#s-parametres");if(!root||Q("#ol-tabs"))return;
  const col=Q(".two-col > div:first-child",root);
  if(col&&state.client&&!Q("#ol-pw-card")){
    col.appendChild(card("ol-pw-card",`<h3>🔑 Mot de passe</h3><label>Nouveau mot de passe<input id="ol-pw1" type="password" autocomplete="new-password"></label><label>Confirmer le mot de passe<input id="ol-pw2" type="password" autocomplete="new-password"></label><button class="btn sm" id="ol-pw-btn" type="button" style="margin-top:10px">Changer le mot de passe</button>`));
    Q("#ol-pw-btn").onclick=async()=>{
      const a=Q("#ol-pw1").value,b=Q("#ol-pw2").value;
      if(a.length<8)return toast("Le mot de passe doit contenir au moins 8 caractères.");
      if(a!==b)return toast("Les deux mots de passe ne sont pas identiques.");
      const btn=Q("#ol-pw-btn");btn.disabled=true;
      const {error}=await state.client.auth.updateUser({password:a});
      btn.disabled=false;
      if(error)return toast("Impossible de changer le mot de passe : "+error.message);
      Q("#ol-pw1").value=Q("#ol-pw2").value="";toast("Mot de passe modifié ✅");
    };
  }
  const tabOf=c=>{const h=Q("h3",c)?.textContent||"";
    if(/Mode d|Pourquoi|propos/.test(h))return "aide";
    if(/bloqu|Zone de s|Mot de passe/.test(h))return "securite";
    return "compte";};
  const bar=document.createElement("div");bar.id="ol-tabs";bar.className="chips";bar.style.margin="0 0 12px";
  bar.innerHTML=[["compte","Compte"],["securite","Sécurité"],["aide","Aide"]].map(x=>`<button type="button" class="chip" data-t="${x[0]}">${x[1]}</button>`).join("");
  const grid=Q(".two-col",root);grid.parentNode.insertBefore(bar,grid);
  const apply=()=>{QA(".card",grid).forEach(c=>{c.style.display=tabOf(c)===curTab?"":"none";});
    QA("[data-t]",bar).forEach(b=>{const on=b.dataset.t===curTab;b.classList.toggle("active",on);b.style.borderColor=on?"var(--cyan)":"";b.style.color=on?"var(--cyan)":"";});};
  bar.onclick=e=>{const b=e.target.closest("[data-t]");if(b){curTab=b.dataset.t;apply();}};
  apply();
});

/* 5) Statistiques du profil (chiffres réels) */
after(render,"profil",async()=>{
  const root=Q("#s-profil"),p=state.viewedProfile||state.profile;if(!root||!p?.id||!state.client)return;
  Q("#ol-stats")?.remove();
  const cnt=async(t,f)=>{const {count}=await f(state.client.from(t).select("*",{count:"exact",head:true}));return count??0;};
  const mine=p.id===state.user?.id;
  const [posts,fol,sub,friends]=await Promise.all([
    cnt("posts",q=>q.eq("auteur",p.id)),cnt("abonnements",q=>q.eq("a",p.id)),cnt("abonnements",q=>q.eq("de",p.id)),
    mine?cnt("amis",q=>q.eq("statut","ami").or(`de.eq.${p.id},a.eq.${p.id}`)):Promise.resolve(null)]);
  const days=p.created_at?Math.max(1,Math.ceil((Date.now()-new Date(p.created_at))/864e5)):null;
  const s=[[posts,"Publications"],[fol,"Abonnés"],[sub,"Abonnements"]];
  if(friends!==null)s.push([friends,"Amis"]);if(days)s.push([days,"Jours sur OtakuLink"]);
  root.appendChild(card("ol-stats",`<h3>Statistiques</h3><div class="stats">${s.map(x=>`<div class="stat"><b>${x[0]}</b><small>${x[1]}</small></div>`).join("")}</div>`));
});

/* 3) + 4) Découvrir : sujets populaires et groupes recommandés (données réelles) */
async function showTag(tag){
  const {data}=await state.client.from("posts").select("texte,created_at").ilike("texte","%"+tag+"%").order("created_at",{ascending:false}).limit(10);
  Q("#modal-root").innerHTML=`<div class="modal" id="modal"><div class="sheet"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="icon-btn" id="m-close" type="button">←</button><h3 style="flex:1">${esc(tag)}</h3></div>${(data||[]).map(p=>`<div class="card"><p>${esc(String(p.texte||"").slice(0,300))}</p><small style="color:var(--muted)">${new Date(p.created_at).toLocaleDateString("fr-FR")}</small></div>`).join("")||"<small style=\"color:var(--muted)\">Aucune publication pour ce sujet.</small>"}</div></div>`;
  const close=()=>{Q("#modal-root").innerHTML="";};Q("#m-close").onclick=close;Q("#modal").onclick=e=>{if(e.target.id==="modal")close();};
}
async function topicsCard(screen){
  Q("#ol-topics")?.remove();
  const since=new Date(Date.now()-30*864e5).toISOString();
  const {data,error}=await state.client.from("posts").select("texte").gte("created_at",since).limit(300);
  if(error)return;
  const n={};(data||[]).forEach(p=>(String(p.texte||"").match(/#[\p{L}\p{N}_]{2,30}/gu)||[]).forEach(t=>{const k=t.toLowerCase();n[k]=(n[k]||0)+1;}));
  const top=Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const c=card("ol-topics",`<h3>Sujets populaires</h3>${top.length?top.map(x=>`<button type="button" class="chip" data-topic="${esc(x[0])}">${esc(x[0])} · ${x[1]}</button>`).join(" "):"<small style=\"color:var(--muted)\">Aucun sujet pour le moment. Ajoute des #tags à tes publications !</small>"}`);
  c.onclick=e=>{const b=e.target.closest("[data-topic]");if(b)showTag(b.dataset.topic);};
  screen.appendChild(c);
}
async function groupsCard(screen){
  Q("#ol-groups")?.remove();
  const {data:gs,error}=await state.client.from("otaku_groups").select("id,nom,description").order("created_at",{ascending:false}).limit(30);
  if(error||!gs?.length)return;
  const {data:ms}=await state.client.from("otaku_group_members").select("group_id,membre");
  const rows=gs.map(g=>({g,n:(ms||[]).filter(m=>m.group_id===g.id).length,joined:(ms||[]).some(m=>m.group_id===g.id&&m.membre===state.user.id)})).sort((a,b)=>b.n-a.n).slice(0,3);
  const c=card("ol-groups",`<h3>Groupes recommandés</h3>${rows.map(r=>`<div class="friend"><div class="meta"><b>${esc(r.g.nom)}</b><small>${r.n} membre(s)</small></div>${r.joined?"<small style=\"color:var(--muted)\">Membre ✓</small>":`<button class="btn sm" type="button" data-join-group="${r.g.id}">Rejoindre</button>`}</div>`).join("")}`);
  c.onclick=async e=>{const b=e.target.closest("[data-join-group]");if(!b)return;b.disabled=true;
    const {error}=await state.client.from("otaku_group_members").insert({group_id:b.dataset.joinGroup,membre:state.user.id});
    if(error){b.disabled=false;return toast("Impossible de rejoindre ce groupe : "+error.message);}
    toast("Tu as rejoint le groupe ✅");groupsCard(screen);};
  screen.appendChild(c);
}
after(render,"decouvrir",async()=>{
  const s=Q("#s-decouvrir");if(!s||!state.client||!state.user)return;
  await topicsCard(s);await groupsCard(s);
});
})();
</script>
<script id="ol-media-posts">
/* Agrandir / télécharger les médias des publications (en arrière-plan, sans rechargement) */
(function(){
const st=document.createElement("style");
st.textContent=".ol-media{position:relative;display:block;line-height:0}.ol-media>.post-media,.ol-media>img,.ol-media>video{display:block}.ol-media>img{cursor:zoom-in}.ol-media-actions{position:absolute;right:8px;top:8px;display:flex;gap:6px;line-height:1}.ol-media-actions button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:16px;padding:0}";
document.head.appendChild(st);
const SEL=".post-media,.group-message img,.group-message video";
const nameOf=u=>{try{return decodeURIComponent(u.split("?")[0].split("/").pop())||"otakulink-media";}catch(_){return "otakulink-media";}};
function decorate(){
  document.querySelectorAll(SEL).forEach(m=>{
    if(m.closest(".ol-media"))return;
    const url=m.currentSrc||m.getAttribute("src");if(!url)return;
    const kind=m.tagName==="VIDEO"?"video":"image",name=nameOf(url),u=esc(url),nm=esc(name);
    const w=document.createElement("span");w.className="ol-media";
    m.parentNode.insertBefore(w,m);w.appendChild(m);
    if(kind==="image"){m.setAttribute("data-chat-view",url);m.dataset.kind="image";m.dataset.name=name;}
    const a=document.createElement("span");a.className="ol-media-actions";
    a.innerHTML=`<button type="button" data-chat-view="${u}" data-kind="${kind}" data-name="${nm}" aria-label="Agrandir">⤢</button><button type="button" data-ol-dl="${u}" data-name="${nm}" aria-label="Télécharger">⬇</button>`;
    w.appendChild(a);
  });
}
let raf=0;
new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(decorate);}).observe(document.body,{childList:true,subtree:true});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-ol-dl]");if(!b)return;
  e.preventDefault();e.stopPropagation();
  if(b.dataset.busy)return;b.dataset.busy="1";const old=b.textContent;b.textContent="…";
  const url=b.dataset.olDl,name=b.dataset.name||"otakulink-media";
  try{
    const r=await fetch(url);if(!r.ok)throw new Error("dl");
    const blob=await r.blob(),o=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=o;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(o),1500);
    b.textContent="✓";
  }catch(_){
    const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.download=name;a.click();b.textContent="↗";
  }
  setTimeout(()=>{b.textContent=old;delete b.dataset.busy;},1500);
},true);
decorate();
})();
</script>
<script id="op-post-viewer">
/* Publication en plein écran + messages : appuyer sur un message affiche ses actions */
(function(){
 let ov=null;
 function close(fromPop){
  if(!ov)return;
  ov.remove();ov=null;document.documentElement.classList.remove('pv-open');
  if(!fromPop&&history.state&&history.state.pv){try{history.back();}catch(_){}}
 }
 function open(card){
  const likeBtn=card.querySelector('[data-like]'),head=card.querySelector(':scope > .post-head'),
        txt=card.querySelector(':scope > p')?.textContent||'',media=card.querySelector(':scope > .post-media'),
        cmts=[...card.querySelectorAll('.post-comment')];
  ov=document.createElement('div');ov.id='post-viewer';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');
  const bar=document.createElement('div');bar.className='pv-bar';
  bar.innerHTML='<button type="button" class="icon-btn" data-pv-close aria-label="Retour">←</button><b>Publication</b>';
  const body=document.createElement('div');body.className='pv-body';
  if(head)body.appendChild(head.cloneNode(true));
  if(txt){const p=document.createElement('p');p.className='pv-text';p.textContent=txt;body.appendChild(p);}
  if(media){
   const isV=media.tagName==='VIDEO',m=document.createElement(isV?'video':'img'),src=media.currentSrc||media.getAttribute('src')||'';
   m.className='pv-media';m.src=src;
   if(isV){m.controls=true;m.playsInline=true;m.preload='metadata';}
   else{m.alt='Image de publication';m.referrerPolicy='no-referrer';m.dataset.chatView=src;m.dataset.kind='image';m.dataset.name='otakulink-image.jpg';}
   body.appendChild(m);
  }
  const act=document.createElement('div');act.className='pv-actions';
  if(likeBtn){const lb=document.createElement('button');lb.type='button';lb.className='pv-like'+(likeBtn.classList.contains('liked')?' liked':'');lb.dataset.pvLike=likeBtn.dataset.like;lb.textContent=likeBtn.textContent;act.appendChild(lb);}
  const cc=document.createElement('span');cc.textContent='💬 '+cmts.length;act.appendChild(cc);body.appendChild(act);
  if(cmts.length){const h=document.createElement('h4');h.textContent='Commentaires';body.appendChild(h);cmts.forEach(c=>body.appendChild(c.cloneNode(true)));}
  ov.append(bar,body);document.body.appendChild(ov);document.documentElement.classList.add('pv-open');
  try{history.pushState({pv:1},'');}catch(_){}
  ov.addEventListener('click',e=>{
   if(e.target.closest('[data-pv-close]')){close();return;}
   if(e.target.closest('[data-profile]')){close();return;}
   const lb=e.target.closest('[data-pv-like]');
   if(lb){
    const src=[...document.querySelectorAll('[data-like]')].find(x=>x.dataset.like===lb.dataset.pvLike&&!ov.contains(x));
    if(src){src.click();setTimeout(()=>{lb.textContent=src.textContent;lb.classList.toggle('liked',src.classList.contains('liked'));},250);}
   }
  });
 }
 window.addEventListener('popstate',()=>close(true));
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
 /* Toucher une publication (texte, image, zone vide) l'ouvre en plein écran ; boutons et liens gardent leur rôle */
 document.addEventListener('click',e=>{
  if(ov||!e.target.closest)return;
  const card=e.target.closest('.card');
  if(!card||!card.querySelector(':scope > .post-head')||!card.querySelector('[data-like]'))return;
  if(e.target.closest('button,a,input,textarea,select,label,video,form,.comment-list,.post-actions'))return;
  e.preventDefault();e.stopPropagation();open(card);
 },true);
 /* Messages : toucher une bulle affiche Répondre / Copier / Supprimer */
 document.addEventListener('click',e=>{
  if(!e.target.closest)return;
  const tool=e.target.closest('#s-messages .message-tools button');
  if(tool){setTimeout(()=>document.querySelectorAll('#s-messages .bubble.show-tools').forEach(x=>x.classList.remove('show-tools')),0);return;}
  const b=e.target.closest('#s-messages .bubble[data-message-bubble]');
  if(!b||e.target.closest('button,a,video,.chat-media-box'))return;
  const was=b.classList.contains('show-tools');
  document.querySelectorAll('#s-messages .bubble.show-tools').forEach(x=>x.classList.remove('show-tools'));
  if(!was)b.classList.add('show-tools');
 });
})();
</script>
