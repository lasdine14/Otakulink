<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b1f">
<meta name="description" content="OtakuLink — communauté des passionnés d’anime et de manga.">
<meta name="color-scheme" content="dark light">
<title>OtakuLink</title>
<style>
:root{
  --bg:#050b1f; --bg2:#0a1330; --card:#0b1432; --card2:#101c42;
  --blue:#1e90ff; --cyan:#22d3ee; --violet:#8b5cf6; --pink:#ec4899;
  --text:#eaf1ff; --muted:#93a4cf; --line:rgba(80,140,255,.35);
  --glow:0 0 14px rgba(30,144,255,.55), inset 0 0 12px rgba(30,144,255,.12);
  --red:#ef2b3d; --green:#22c55e; --gold:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Segoe UI",Roboto,system-ui,sans-serif;color:var(--text);
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.35),transparent 60%),
    radial-gradient(800px 500px at -10% 110%,rgba(30,144,255,.30),transparent 60%),
    var(--bg);
  background-attachment:fixed; overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
a{color:var(--cyan);text-decoration:none}
.hidden{display:none!important}

/* ===== Layout ===== */
#app{height:100%;display:flex}
#sidebar{
  width:230px;flex:none;padding:18px 14px;display:none;flex-direction:column;gap:6px;
  border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(10,19,48,.9),rgba(5,11,31,.9));
  box-shadow:var(--glow);overflow-y:auto;
}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
#screens{flex:1;overflow-y:auto;padding:14px 14px 96px;scroll-behavior:smooth}
.screen{display:none;animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Logo ===== */
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:12px}
.torii{width:46px;height:38px;filter:drop-shadow(0 0 8px var(--cyan))}
.logo b{font-size:26px;letter-spacing:.5px;font-weight:800}
.logo b span,.grad{color:var(--cyan)}
.logo.big b{font-size:38px}
.logo.big .torii{width:70px;height:58px}

/* ===== Nav ===== */
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;font-weight:600;
  color:var(--text);position:relative;width:100%;text-align:left;
}
.nav-item .ic{font-size:19px;width:24px;text-align:center}
.nav-item:hover{background:rgba(30,144,255,.12)}
.nav-item.active{background:linear-gradient(90deg,#1478ff,#1e90ff);box-shadow:0 0 16px rgba(30,144,255,.7)}
.badge{
  min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-left:auto;
}
.side-promo{
  margin-top:auto;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--glow);
  background:linear-gradient(160deg,rgba(139,92,246,.35),rgba(10,19,48,.9));
}
.side-promo h4{font-size:15px;margin-bottom:6px}
.side-promo ul{list-style:none;font-size:13px;margin-bottom:10px;color:var(--muted)}
.side-promo li::before{content:"✔ ";color:var(--green)}

#bottomnav{
  position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));height:68px;z-index:30;
  display:flex;align-items:center;justify-content:space-around;
  background:rgba(8,15,40,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--glow);
}
#bottomnav .bn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text);position:relative;padding:6px 8px;border-radius:16px}
#bottomnav .bn .ic{font-size:21px}
#bottomnav .bn.active{color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
#bottomnav .bn .badge{position:absolute;top:0;right:0;margin:0;min-width:16px;height:16px;font-size:10px}
#fab{
  width:58px;height:58px;border-radius:50%;border:2px solid var(--cyan);font-size:32px;line-height:1;
  background:radial-gradient(circle,#0e2a6b,#071233);box-shadow:0 0 18px var(--cyan);margin-top:-22px;color:var(--text);
}

@media(min-width:900px){
  #sidebar{display:flex}
  #bottomnav{left:244px;right:14px}
  #screens{padding:18px 22px 96px}
}

/* ===== Common blocks ===== */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.topbar h1{font-size:26px;font-weight:800}
.topbar p{font-size:13px;color:var(--muted)}
.topbar .sp{flex:1}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:18px;position:relative;background:rgba(15,27,66,.7);
}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;margin:0}
.card{
  background:linear-gradient(180deg,rgba(14,26,62,.92),rgba(8,15,40,.92));
  border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--glow);margin-bottom:14px;
}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--cyan);font-weight:600}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;
  background:linear-gradient(90deg,#1478ff,#1ec3ff);box-shadow:0 0 16px rgba(30,144,255,.6);color:#fff;transition:.15s;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.block{width:100%}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.ghost{background:rgba(15,27,66,.8);border:1px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#2b1a00;box-shadow:0 0 16px rgba(251,191,36,.5)}
.btn.danger{background:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(15,27,66,.7);font-size:14px;font-weight:600;
}
.chip.active{background:linear-gradient(90deg,#1478ff,#1e90ff);box-shadow:0 0 12px rgba(30,144,255,.7);border-color:transparent}
.tag{display:inline-block;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(15,27,66,.8);font-size:12px;margin:0 6px 6px 0}

/* ===== Avatars (placeholders colorés) ===== */
.av{
  width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;
  border:2px solid var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.6);position:relative;background:var(--g,linear-gradient(135deg,#6d28d9,#1e90ff));
}
.av.lg{width:96px;height:96px;font-size:44px}
.av.sm{width:38px;height:38px;font-size:18px}
.av .on{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.av .on.off{background:#7c86a8}
.g1{--g:linear-gradient(135deg,#7c3aed,#ec4899)}
.g2{--g:linear-gradient(135deg,#f59e0b,#ef4444)}
.g3{--g:linear-gradient(135deg,#ec4899,#f9a8d4)}
.g4{--g:linear-gradient(135deg,#0ea5e9,#6366f1)}
.g5{--g:linear-gradient(135deg,#10b981,#0ea5e9)}
.g6{--g:linear-gradient(135deg,#dc2626,#7c3aed)}
.verified{color:#38bdf8;font-size:14px}

.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;text-align:center;font-size:12px;width:64px}
.story .av{margin:0 auto 5px;width:58px;height:58px}
.story.add .av{background:#06102c;font-size:30px}

/* ===== Posts ===== */
.post-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post-head b{display:block}
.post-head small{color:var(--muted)}
.post-img{
  border-radius:14px;height:200px;margin:10px 0;display:flex;align-items:center;justify-content:center;font-size:72px;
  background:var(--g,linear-gradient(135deg,#1e3a8a,#7c3aed));border:1px solid var(--line);position:relative;overflow:hidden;
}
.post-img::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,rgba(255,255,255,.25),transparent 50%)}
.post-actions{display:flex;gap:18px;align-items:center;color:var(--text);font-size:14px}
.post-actions button{display:flex;gap:6px;align-items:center;font-weight:600}
.post-actions button.liked{color:#ff4d6d}
.post-actions .sp{flex:1}
.comment{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px}
.post-media{display:block;width:100%;max-height:360px;object-fit:cover;border-radius:14px;margin:10px 0;border:1px solid var(--line)}
.comment-list{margin-top:10px}.comment-form{display:flex;gap:8px;margin-top:10px}.comment-form input{flex:1;min-width:0;background:rgba(15,27,66,.8);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.post-comment{padding:8px 10px;margin-top:6px;background:rgba(255,255,255,.045);border-radius:10px;font-size:13px}.post-comment small{color:var(--muted)}
.composer{display:flex;gap:10px;align-items:center}
.composer input{flex:1;background:rgba(15,27,66,.8);border:1px solid var(--line);border-radius:999px;padding:12px 16px;outline:none}

.two-col{display:grid;gap:14px}
@media(min-width:1100px){.two-col{grid-template-columns:minmax(0,1fr) 320px}}

.trend-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(80,140,255,.15);font-size:14px}
.trend-row:last-child{border:0}
.trend-row b{width:18px;color:var(--muted)}
.trend-row span:last-child{margin-left:auto;color:#fb923c}
.group-row{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.group-row small{display:block;color:var(--muted)}
.group-row .btn{margin-left:auto}

/* ===== Discover grid ===== */
.searchbar{display:flex;gap:10px;margin-bottom:12px}
.searchbar input{flex:1;background:rgba(15,27,66,.8);border:1px solid var(--line);border-radius:999px;padding:12px 16px;outline:none}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.pcard{
  border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--glow);background:var(--card);
  display:flex;flex-direction:column;
}
.pcard .cover{
  height:150px;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative;
  background:var(--g,linear-gradient(135deg,#1e3a8a,#7c3aed));
}
.pcard .status{
  position:absolute;top:8px;left:8px;font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid var(--green);color:#4ade80;
}
.pcard .status.off{border-color:#7c86a8;color:#b6bfd9}
.pcard .heart{position:absolute;top:6px;right:8px;font-size:20px}
.pcard .heart.on{color:#ff4d6d}
.pcard .body{padding:10px 12px 12px}
.pcard .body b{font-size:15px}
.pcard .body small{display:block;color:var(--muted);margin:2px 0 8px;font-size:12px}
.pcard .row{display:flex;gap:8px}
.pcard .row .btn{flex:1;padding:8px}

/* ===== Messages ===== */
.msg-wrap{display:grid;gap:14px}
@media(min-width:900px){.msg-wrap{grid-template-columns:320px 1fr;height:calc(100vh - 190px)}}
.conv-list{overflow-y:auto}
.conv{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;margin-bottom:4px}
.conv:hover,.conv.active{background:rgba(30,144,255,.18);box-shadow:inset 0 0 0 1px var(--line)}
.conv .meta{flex:1;min-width:0}
.conv .meta b{display:block;font-size:15px}
.conv .meta small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.conv .time{font-size:12px;color:var(--muted);text-align:right}
.conv .time .badge{margin:4px 0 0 auto}
.chat{display:flex;flex-direction:column;min-height:420px}
.chat-head{display:flex;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chat-body{flex:1;overflow-y:auto;padding:14px 4px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.35}
.bubble small{display:block;font-size:11px;opacity:.7;margin-top:3px}
.bubble.in{background:#1b2547;align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:linear-gradient(135deg,#1478ff,#1e6bff);align-self:flex-end;border-bottom-right-radius:4px}
.chat-input{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;background:rgba(15,27,66,.8)}
.chat-input input{flex:1;background:none;border:0;outline:none;padding:8px 0}
.send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#1478ff,#1ec3ff);font-size:18px}
.back-mobile{display:inline-flex}
@media(min-width:900px){.back-mobile{display:none}}
@media(max-width:899px){
  .msg-wrap.chat-open .conv-col{display:none}
  .msg-wrap:not(.chat-open) .chat{display:none}
}

/* ===== Connexions ===== */
.friend{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(80,140,255,.15)}
.friend:last-child{border:0}
.friend .meta{flex:1;min-width:0}
.friend .meta b{display:block}
.friend .meta small{color:var(--muted);font-size:12px}
.round{width:36px;height:36px;border-radius:10px;font-weight:700}
.round.ok{background:#1478ff}
.round.no{background:var(--red)}

/* ===== Profile ===== */
.banner{
  height:160px;border-radius:18px;border:1px solid var(--line);box-shadow:var(--glow);position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 70% 25%,#fff8,#fff0 7%),
    radial-gradient(circle at 70% 25%,#c7d2fe55,#0000 25%),
    linear-gradient(135deg,#1e1b4b,#4c1d95 50%,#1e3a8a);
}
.banner::after{content:"⛩️";position:absolute;right:18px;bottom:8px;font-size:60px;opacity:.5}
.profile-top{display:flex;gap:14px;align-items:flex-end;margin:-44px 14px 10px;position:relative;flex-wrap:wrap}
.profile-top h2{font-size:22px}
.level{display:inline-block;padding:3px 12px;border-radius:999px;background:linear-gradient(90deg,#6d28d9,#a855f7);font-weight:700;font-size:13px}
.stats{display:flex;gap:6px;margin:12px 0}
.stat{flex:1;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:rgba(15,27,66,.7)}
.stat b{display:block;font-size:18px}
.stat small{color:var(--muted);font-size:12px}
.badges{display:flex;gap:10px;font-size:34px;flex-wrap:wrap}
.anime-row{display:flex;gap:10px;overflow-x:auto}
.anime{flex:none;width:72px;text-align:center;font-size:12px}
.anime .th{height:84px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;border:1px solid var(--line);background:var(--g);margin-bottom:4px}

/* ===== Settings ===== */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(80,140,255,.15)}
.row:last-child{border:0}
.row .ic{font-size:20px;width:26px;text-align:center}
.row .t{flex:1}
.row .t small{display:block;color:var(--muted);font-size:12px}
.row .val{color:var(--muted);font-size:13px}
.switch{width:48px;height:27px;border-radius:999px;background:#2a3358;position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--blue);box-shadow:0 0 10px rgba(30,144,255,.7)}
.switch.on::after{left:24px}
.pro-card{background:linear-gradient(160deg,rgba(251,191,36,.18),rgba(139,92,246,.3),rgba(10,19,48,.9))}
.pro-card ul{list-style:none;margin:8px 0 12px;font-size:14px}
.pro-card li::before{content:"✔ ";color:var(--green)}
.danger-t{color:#ff6070}

/* ===== Create post ===== */
.modal{
  position:fixed;inset:0;z-index:60;background:rgba(2,5,16,.78);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:700px){.modal{align-items:center}}
.sheet{
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:16px;box-shadow:var(--glow);animation:fade .25s;
}
@media(min-width:700px){.sheet{border-radius:22px}}
.sheet textarea{
  width:100%;min-height:120px;background:rgba(15,27,66,.8);border:1px solid var(--line);border-radius:14px;padding:12px;outline:none;resize:vertical
}
.add-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.add-row button{border:1px dashed var(--line);border-radius:12px;padding:12px 4px;font-size:12px;color:var(--muted)}

/* ===== Auth screens (plein écran) ===== */
#auth{
  position:fixed;inset:0;z-index:80;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(500px 500px at 75% 15%,rgba(199,210,254,.45),transparent 25%),
    radial-gradient(700px 500px at 20% 90%,rgba(139,92,246,.45),transparent 60%),
    linear-gradient(180deg,#07103a,#050b1f);
}
.auth-box{width:100%;max-width:400px;text-align:center}
.auth-box h2{font-size:28px;margin:6px 0}
.auth-box .sub{color:var(--muted);margin-bottom:18px;font-size:14px}
.field{
  display:flex;align-items:center;gap:10px;background:rgba(15,27,66,.85);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:12px;
  box-shadow:var(--glow);
}
.field input{flex:1;background:none;border:0;outline:none;padding:15px 0;min-width:0}
.field .eye{font-size:16px;opacity:.8}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 14px;text-align:left}
.check input{accent-color:var(--blue);width:18px;height:18px}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.socials{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
.socials button{width:84px;height:48px;border-radius:999px;border:1px solid var(--line);background:rgba(15,27,66,.8);font-weight:800;font-size:17px}
.auth-foot{font-size:14px;color:var(--text)}
.slogan{font-style:italic;color:var(--cyan);margin-top:14px}
.hero-list{list-style:none;text-align:left;margin:16px auto;display:inline-block;font-size:14px}
.hero-list li{margin:6px 0}
.err{color:#ff7a88;font-size:13px;min-height:18px;margin-bottom:6px}
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#0e1c4a;border:1px solid var(--cyan);border-radius:999px;
  padding:10px 20px;z-index:100;font-size:14px;box-shadow:0 0 18px rgba(34,211,238,.5);animation:fade .2s;
}
.env{font-size:60px;filter:drop-shadow(0 0 14px var(--cyan));margin:10px 0}

label:not(.field){display:block;font-size:13px;color:var(--muted);margin:10px 0}
label:not(.field) input,label:not(.field) textarea{display:block;width:100%;margin-top:6px;background:rgba(15,27,66,.8);border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--text);outline:none}
html[data-theme="light"] body{background:#eef3ff;color:#17233f}
html[data-theme="light"] .card,html[data-theme="light"] .pcard{background:#fff;color:#17233f}
html[data-theme="light"] #bottomnav{background:rgba(255,255,255,.94)}

/* ===== Refonte visuelle inspirée de la maquette OtakuLink ===== */
:root{--bg:#020817;--bg2:#06132d;--card:#071735;--card2:#0b2045;--blue:#087cff;--cyan:#00e5ff;--violet:#8b5cf6;--pink:#ff3ea5;--text:#f2f7ff;--muted:#a8b9dc;--line:rgba(27,154,255,.48);--glow:0 0 18px rgba(0,177,255,.42),inset 0 0 14px rgba(0,133,255,.10)}
body{background:radial-gradient(ellipse at 50% -15%,rgba(0,112,255,.27),transparent 48%),radial-gradient(ellipse at 100% 80%,rgba(90,32,190,.22),transparent 45%),linear-gradient(145deg,#020817,#06132b 55%,#03091b);}
#screens{padding:12px 10px 100px;max-width:1500px;margin:0 auto;width:100%}
.topbar{padding:7px 4px 12px;border-bottom:1px solid rgba(30,144,255,.18)}
.topbar h1{font-size:22px;letter-spacing:-.4px}.topbar p{display:none}
.card,.pcard{background:linear-gradient(155deg,rgba(8,28,66,.97),rgba(3,12,32,.98));border:1px solid rgba(28,150,255,.42);border-radius:19px;box-shadow:0 0 13px rgba(0,123,255,.24),inset 0 0 14px rgba(0,125,255,.07)}
.btn{background:linear-gradient(100deg,#087cff,#00d9ff);color:#00122b;box-shadow:0 0 18px rgba(0,191,255,.45);font-weight:800}
.btn.danger{background:linear-gradient(100deg,#ff174d,#e90054);color:white}
.chip{background:rgba(4,20,50,.92);border-color:rgba(38,145,255,.4);font-size:13px;padding:8px 14px}
.chip.active{background:linear-gradient(100deg,#087cff,#00cfff);color:#00152c}
#bottomnav{left:6px;right:6px;bottom:max(6px,env(safe-area-inset-bottom));height:66px;padding:4px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;align-items:center;border-radius:18px;background:rgba(2,10,29,.97);border:1px solid rgba(0,180,255,.55);box-shadow:0 0 22px rgba(0,149,255,.42);backdrop-filter:blur(16px)}
#bottomnav .bn{width:100%;min-width:0;max-width:none;padding:5px 1px;gap:2px;font-size:clamp(8px,2.25vw,10px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:clip;border-radius:12px}
#bottomnav .bn .ic{font-size:19px;line-height:1.1}#bottomnav .bn.active{color:#00e5ff;text-shadow:0 0 12px #00dfff}
#fab{width:40px;height:40px;justify-self:center;margin:0;background:linear-gradient(145deg,#087cff,#00dfff);color:#00152a;border:2px solid #8df5ff;font-weight:900;font-size:28px}
@media(max-width:360px){#bottomnav .bn{font-size:8px}#bottomnav .bn .ic{font-size:17px}#fab{width:36px;height:36px}}
.nav-item{border-radius:13px}.nav-item.active{background:linear-gradient(100deg,#087cff,#00cfff);color:#00152a}
.av{border-color:#00dcff;box-shadow:0 0 12px rgba(0,220,255,.6);overflow:hidden}.av img{display:block}
.stories{gap:12px;padding:7px 2px 13px}.story{width:68px}.story .av{width:58px;height:58px;border:2px solid #00dfff;padding:2px;background:linear-gradient(135deg,#00dfff,#a42cff)}
.post-head{align-items:center}.post-img{height:auto;min-height:170px;max-height:360px;border-radius:13px}
.searchbar input,.composer input,.field{background:rgba(5,20,49,.94);border-color:rgba(0,155,255,.48)}
.banner{height:185px;background:radial-gradient(circle at 75% 25%,rgba(76,164,255,.6),transparent 22%),radial-gradient(circle at 15% 80%,rgba(112,41,220,.35),transparent 45%),linear-gradient(130deg,#07183c,#102d68 50%,#07122e)}
.profile-top{margin-top:-48px}.stats{gap:8px}.stat{background:rgba(4,20,49,.88);border-color:rgba(0,160,255,.35)}
.sheet{background:linear-gradient(160deg,#071a3b,#030b20);border-color:#078fff}
.field{border-radius:13px}.auth-box{max-width:420px}.auth-box .logo{margin-bottom:10px}
@media(min-width:900px){#screens{padding:18px 24px 100px}#bottomnav{left:244px;right:14px} .topbar h1{font-size:25px}}
@media(max-width:600px){.topbar h1{font-size:20px}.card{padding:12px;margin-bottom:11px}.two-col{grid-template-columns:1fr}.profile-top{margin-left:8px;margin-right:8px}.av.lg{width:82px;height:82px}.stats .stat b{font-size:16px}}

.btn.ghost{color:var(--text)}
html[data-theme="light"]{--text:#17233f;--muted:#55648a;--bg2:#fff;--line:rgba(30,100,220,.35);--glow:0 1px 8px rgba(30,100,220,.15)}
html[data-theme="light"] #auth{background:#eef3ff}
html[data-theme="light"] #sidebar,html[data-theme="light"] .sheet{background:#fff}
html[data-theme="light"] .side-promo{background:#f1ebff}
html[data-theme="light"] .field,html[data-theme="light"] .searchbar input,html[data-theme="light"] .composer input,html[data-theme="light"] .chat-input,html[data-theme="light"] .chip,html[data-theme="light"] .stat,html[data-theme="light"] .icon-btn,html[data-theme="light"] label:not(.field) input,html[data-theme="light"] label:not(.field) textarea,html[data-theme="light"] .sheet textarea,html[data-theme="light"] .btn.ghost{background:#f4f7ff}
html[data-theme="light"] .bubble.in{background:#e6ecfb}
html[data-theme="light"] .comment{background:#f1f4fb}
html[data-theme="light"] .toast,html[data-theme="light"] .bubble.out,html[data-theme="light"] .round{color:#fff}


/* ===== Améliorations visuelles et raccourcis globaux (ajouts non destructifs) ===== */
#global-toolbar{
  position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin:0 0 8px;
  background:linear-gradient(100deg,rgba(3,12,32,.97),rgba(5,25,58,.94));
  border:1px solid rgba(0,190,255,.38);border-radius:0 0 18px 18px;
  box-shadow:0 5px 22px rgba(0,130,255,.18);backdrop-filter:blur(16px)
}
#global-toolbar .gt-brand{font-weight:900;font-size:18px;letter-spacing:-.4px}
#global-toolbar .gt-brand span{color:var(--cyan)}
#global-toolbar .gt-sp{flex:1}
#global-toolbar .gt-action{
  width:39px;height:39px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(0,190,255,.42);background:rgba(7,28,65,.9);
  font-size:18px;position:relative
}
#global-toolbar .gt-action:active{transform:scale(.94)}
#global-toolbar .gt-dot{position:absolute;right:-2px;top:-3px;min-width:17px;height:17px;
  border-radius:20px;background:#f32950;color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
#screens{scroll-padding-top:10px}
#quick-search-modal .sheet,#quick-notif-modal .sheet{max-height:84vh}
.quick-result{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid rgba(70,150,255,.15)}
.quick-result:last-child{border:0}
.quick-result .meta{flex:1;min-width:0}
.quick-result small{display:block;color:var(--muted);font-size:12px}
.global-story-card{margin-bottom:12px}
.global-story-card .stories{min-height:88px}
@media(min-width:900px){
 #global-toolbar{margin:0 0 12px;border-radius:16px}
}
html[data-theme="light"] #global-toolbar{background:rgba(255,255,255,.96)}
html[data-theme="light"] #global-toolbar .gt-action{background:#f1f6ff}



/* Retours tactiles discrets : les actions restent dans le fil sans rechargement. */
.post-actions button{transition:transform .12s ease,opacity .12s ease}
.post-actions button:active{transform:scale(.94)}
.post-actions button:disabled{opacity:.65;cursor:wait}

/* Correctifs messagerie : réponses lisibles et bulles de groupe différenciées */
.reply-context{font-size:12px;font-weight:700;color:#9edfff;background:rgba(0,210,255,.09);border-left:3px solid var(--cyan);padding:5px 8px;border-radius:7px;margin-bottom:7px}
.group-message.group-message-me{align-self:flex-end;background:linear-gradient(135deg,#126ce8,#168eea);border-color:rgba(75,190,255,.45);border-radius:16px 16px 4px 16px}
.group-message.group-message-me b,.group-message.group-message-me small{color:#e4f5ff}
.group-message.group-message-other{align-self:flex-start;border-radius:16px 16px 16px 4px}

<script type="module">
/* OtakuLink — version préparée pour Supabase.
   Aucune donnée de démonstration : les listes proviennent uniquement de la base.
   Configure SUPABASE_URL et SUPABASE_ANON_KEY avant de déployer. */
const SUPABASE_URL = 'https://jnepjuszrppaasdopnlo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_aST32y-TGzIttH9RAnm64w_dv3d_Wdc';
const SUPABASE_READY = /^https:\/\/.+\.supabase\.co$/.test(SUPABASE_URL) &&
  SUPABASE_ANON_KEY.startsWith('sb_publishable_');

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = v => v ? new Date(v).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '';
const toast = message => {
  const el=document.createElement('div'); el.className='toast'; el.textContent=message;
  document.body.appendChild(el); setTimeout(()=>el.remove(),3000);
};
function notifyUser(title,body){
  if(!state.settings.notifications)return;
  if('Notification' in window && Notification.permission==='granted' && document.hidden){
    try{new Notification(title,{body,icon:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#07152f"/><path d="M7 16Q32 25 57 16M12 27h40M18 27v28M46 27v28" stroke="#22d3ee" stroke-width="5" fill="none"/></svg>')});}catch(_){}}
}
function safeImageUrl(value){try{const u=new URL(String(value||'').trim());return ['https:','http:'].includes(u.protocol)?u.href:'';}catch(_){return '';}}
function postTextAndImage(text){const value=String(text||'');const m=value.match(/(?:^|\n)\[\[(?:media:(image|video)|image):(https?:\/\/[^\]]+)\]\]\s*$/i);return {text:m?value.slice(0,m.index).trim():value,kind:m?(m[1]||'image').toLowerCase():'',url:m?safeImageUrl(m[2]):''};}
const TORII = `<svg class="torii" viewBox="0 0 64 52" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10c14 4 42 4 56 0"/><path d="M10 20h44"/><path d="M16 10v38M48 10v38"/><path d="M32 12v8"/></svg>`;
const LOGO = big => `<div class="logo ${big?'big':''}">${TORII}<b>Otaku<span>Link</span></b></div>`;
const NAV = [['decouvrir','🔎','Amis'],['rencontres','💘','Rencontres'],['communaute','👥','Communauté'],['messages','💬','Messages'],['connexions','🤝','Connexions'],['profil','👤','Profil'],['otakuplus','✨','Otaku+'],['parametres','⚙️','Paramètres']];
const BOTTOM = ['decouvrir','rencontres','communaute','otakuplus','FAB','messages','profil'];
const state = { client:null, user:null, profile:null, route:'decouvrir', query:'', filter:'Tous', posts:[], users:[], requests:[], friends:[], conversations:[], messagesCache:null, activeChat:null, replyTo:null, settings:{dark:true,private:false,notifications:true}, busy:false, blocked:new Set(), blockedByMe:new Set(), unread:0, routeCache:{} };

function ageOf(d){if(!d)return -1;const [y,m,day]=String(d).split('-').map(Number);if(!y||!m||!day)return -1;const now=new Date();let a=now.getFullYear()-y;if(now.getMonth()+1<m||(now.getMonth()+1===m&&now.getDate()<day))a--;return a;}
async function loadBlocks(){const {data}=await state.client.from('blocages').select('de,a');const rows=data||[];state.blockedByMe=new Set(rows.filter(x=>x.de===state.user.id).map(x=>x.a));state.blocked=new Set(rows.map(x=>x.de===state.user.id?x.a:x.de));}
async function fetchProfiles(ids){ids=[...new Set(ids)].filter(Boolean);if(!ids.length){state.users=[];return state.users;}const {data}=await state.client.from('profiles').select('id,pseudo,bio,pays,avatar_url,cover_url,centres_interet,animes_favoris').in('id',ids);state.users=data||[];return state.users;}
async function refreshUnread(){if(!state.client||!state.user)return;/* La table messages actuelle ne possède pas forcément la colonne lu. On désactive le compteur plutôt que de faire échouer la messagerie. */state.unread=0;$$('[data-go="messages"]').forEach(b=>b.querySelector('.badge')?.remove());}
function startRealtime(){state.client.channel('msgs-'+state.user.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`a=eq.${state.user.id}`},p=>{if(state.blocked.has(p.new.de))return;if(state.route==='messages'&&state.activeChat===p.new.de&&$('#chat-body')){const body=$('#chat-body');const b=document.createElement('div');b.className='bubble in';b.dataset.messageBubble=p.new.id;const media=postTextAndImage(p.new.texte);const t=document.createElement('div');t.textContent=media.text;b.appendChild(t);const tm=document.createElement('small');tm.textContent=fmtDate(p.new.created_at);b.appendChild(tm);const tools=document.createElement('div');tools.className='message-tools';tools.innerHTML=`<button type="button" data-message-reply="${p.new.id}">↩ Répondre</button><button type="button" data-message-copy="${p.new.id}">Copier</button>`;b.appendChild(tools);body.appendChild(b);body.scrollTop=body.scrollHeight;}else {toast('💬 Nouveau message');notifyUser('Nouveau message OtakuLink','Tu as reçu un nouveau message.');}refreshUnread();}).subscribe();}
const relBtn=id=>{const x=state.rel?.get(id);if(!x)return `<button class="btn sm" data-connect="${id}">Ajouter</button>`;if(x.statut==='ami')return `<button class="btn sm ghost" data-message="${id}">💬 Message</button>`;if(x.de===state.user.id)return `<button class="btn sm ghost" disabled>Demande envoyée</button>`;return `<button class="btn sm" data-accept="${id}">Accepter</button>`;};
function configNotice() {
  return `<div class="card" style="border-color:#fbbf24">
    <h3>⚙️ Connexion à Supabase à configurer</h3>
    <p style="color:var(--muted);line-height:1.6">L'interface ne contient aucun faux membre. Pour activer les comptes, publications, connexions et messages, ajoute l'URL et la clé publique de ton projet Supabase dans le début du script, puis exécute le schéma SQL de ton projet dans le SQL Editor de Supabase. Les commentaires nécessitent aussi la migration disponible dans Paramètres.</p>
  </div>`;
}
function showAuth(view='welcome') {
  const box=$('#auth-content');
  const screens={
    welcome:`${LOGO(true)}<p style="margin:18px 0 6px;font-size:20px;font-weight:700">La communauté des passionnés d'anime et de manga.</p>
      <ul class="hero-list"><li>🤝 Rencontrer des passionnés</li><li>🌌 Partager ses univers</li><li>✨ Découvrir de nouveaux membres</li></ul>
      ${!SUPABASE_READY?`<div class="err">La configuration Supabase est nécessaire avant de créer un compte.</div>`:''}
      <button class="btn block" data-auth="signup">Créer un compte →</button><button class="btn ghost block" style="margin-top:12px" data-auth="login">Se connecter</button><p class="slogan">Share your universe.</p>`,
    signup:`${LOGO()}<h2>Inscription</h2><p class="sub">Crée ton compte OtakuLink</p>
      <form id="f-signup" novalidate>
      <label class="field">👤<input name="username" minlength="3" maxlength="24" placeholder="Nom d'utilisateur" autocomplete="username" required></label>
      <label class="field">✉️<input name="email" type="email" placeholder="Adresse e-mail" autocomplete="email" required></label>

      <label class="field">🔒<input name="password" type="password" minlength="8" placeholder="Mot de passe (8 caractères minimum)" autocomplete="new-password" required><span class="eye" data-eye>👁</span></label>

      <div class="err" id="auth-error"></div><button class="btn block" type="submit">Créer mon compte →</button></form>

    login:`${LOGO()}<h2>Bon retour !</h2><p class="sub">Connecte-toi à ton compte</p>
      <form id="f-login" novalidate><label class="field">✉️<input name="email" type="email" placeholder="Adresse e-mail" autocomplete="email" required></label>
      <label class="field">🔒<input name="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required><span class="eye" data-eye>👁</span></label>
      <div class="err" id="auth-error"></div><button class="btn block" type="submit">Se connecter →</button></form>
      <p style="margin:12px 0"><a href="#" data-auth="forgot">Mot de passe oublié ?</a></p><p class="auth-foot">Pas encore de compte ? <a href="#" data-auth="signup">S'inscrire</a></p>`,
    forgot:`${LOGO()}<h2>Réinitialiser le mot de passe</h2><p class="sub">Un lien sera envoyé à ton adresse e-mail.</p>
      <form id="f-forgot"><label class="field">✉️<input name="email" type="email" placeholder="Adresse e-mail" required></label><div class="err" id="auth-error"></div><button class="btn block">Envoyer le lien</button></form>
      <p style="margin-top:14px"><a href="#" data-auth="login">Retour à la connexion</a></p>`
  };
  box.innerHTML=screens[view]||screens.welcome;
  $('#auth').classList.remove('hidden'); $('#app').classList.add('hidden');
}
function showApp() { $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden'); buildChrome(); go(state.route); refreshUnread(); if(typeof refreshGlobalNotificationCount==='function') refreshGlobalNotificationCount(); }
function authError(msg) { const el=$('#auth-error'); if(el) el.textContent=msg; else toast(msg); }
function requireClient() { if(!state.client){toast('Configure Supabase pour activer cette fonctionnalité.');return false;} return true; }

async function init() {
  showAuth('welcome');
  if(!SUPABASE_READY) return;
  try {
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');

    const {data:{session}}=await state.client.auth.getSession();

  showApp();

function go(route){
  const previous=state.route;
  state.route=route;
  $$('.screen').forEach(s=>s.classList.toggle('active',s.id==='s-'+route));
  $$('[data-go]').forEach(b=>{if(b.classList.contains('nav-item')||b.classList.contains('bn'))b.classList.toggle('active',b.dataset.go===route)});
  const screen=$('#s-'+route), now=Date.now(), cached=state.routeCache?.[route]||0;
  // Réutilise l'écran déjà affiché pendant 30 secondes : évite les requêtes et animations inutiles.
  if(screen?.dataset.loaded==='true' && now-cached<30000){if(previous!==route)$('#screens').scrollTo({top:0});return;}
  const task=render[route]?.();
  if(task&&typeof task.then==='function')task.finally(()=>{if(screen){screen.dataset.loaded='true';state.routeCache[route]=Date.now();}});
  else if(screen){screen.dataset.loaded='true';state.routeCache[route]=now;}
  if(previous!==route)$('#screens').scrollTo({top:0});
}

function splitReplyMessage(value){
  const text=String(value||'');
  if(!text.startsWith('↪ Réponse à '))return {author:'',body:text};
  const cut=text.indexOf('\n\n');
  if(cut<0)return {author:'',body:text};
  const header=text.slice(0,cut);
  const match=header.match(/^↪ Réponse à (.+?)\s*:/);
  return {author:match?.[1]||'',body:text.slice(cut+2)};
}

    body?.appendChild(bubble);if(body)body.scrollTop=body.scrollHeight;
    if(input)input.value='';const mediaInput=$('#chat-media');if(mediaInput)mediaInput.value='';const note=$('#chat-file-name');if(note){note.hidden=true;note.textContent='';}
    state.replyTo=null;const preview=$('#reply-preview');if(preview){preview.hidden=true;preview.innerHTML='';}
    try{
      // Ne demande pas de ligne en retour : l'envoi ne dépend donc pas d'une
      // colonne facultative (ex. lu) ni d'une autorisation SELECT après INSERT.
      const {error:sendError}=await state.client.from('messages').insert({de:state.user.id,a:selected,texte:content});

      copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(parsed.text||'');toast('Message copié.');}catch(_){toast('Copie non disponible sur ce navigateur.');}});
      msgTools.appendChild(copyBtn);tools.replaceWith(msgTools);
      if(body)body.scrollTop=body.scrollHeight;
      refreshUnread();
    }catch(err){bubble.remove();if(input)input.value=parsed.text;toast('Envoi impossible : '+(err.message||err));}

  });

async function uploadOtakuFile(file, folder='media') {
 if(!file) return '';
 if(file.size>50*1024*1024) throw new Error('Le fichier dépasse 50 Mo.');
 const allowed=['image/jpeg','image/png','image/gif','image/webp','video/mp4','video/webm','video/quicktime'];
 if(!allowed.includes(file.type)) throw new Error('Format de fichier non pris en charge.');
 if(file.type.startsWith('video/')){
  const v=document.createElement('video');v.preload='metadata';const duration=await new Promise(resolve=>{v.onloadedmetadata=()=>resolve(v.duration);v.onerror=()=>resolve(Infinity);v.src=URL.createObjectURL(file);});
  if(!Number.isFinite(duration)||duration>60.5) throw new Error('La vidéo doit durer 1 minute maximum.');
 }
 const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
 const path=`${state.user.id}/${folder}/${Date.now()}-${crypto.randomUUID()}.${ext}`;
 const {error}=await state.client.storage.from('otakulink-media').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});
 if(error) throw new Error('Envoi impossible : '+error.message);
 return state.client.storage.from('otakulink-media').getPublicUrl(path).data.publicUrl;
}

async function viewStories(uid){
 const {data,error}=await state.client.from('stories').select('id,media_url,media_type,created_at').eq('auteur',uid).gt('created_at',new Date(Date.now()-86400000).toISOString()).order('created_at',{ascending:true});
 if(error||!data?.length)return toast('Aucune story disponible.');
 const ids=data.map(x=>x.id);
 const {data:reactionRows,error:reactionError}=await state.client.from('story_reactions').select('story_id,auteur,reaction').in('story_id',ids);
 if(reactionError){console.warn('Réactions stories indisponibles :',reactionError.message);}
 const reactions=reactionRows||[];
 let i=0;
 const draw=()=>{
  const x=data[i],mine=reactions.find(r=>r.story_id===x.id&&r.auteur===state.user.id);
  const choices=['❤️','😂','😍','🔥','👍'];
  const counts=choices.map(emoji=>({emoji,count:reactions.filter(r=>r.story_id===x.id&&r.reaction===emoji).length}));
  $('#modal-root').innerHTML=`<div class="modal" id="story-modal"><div class="sheet" style="max-width:520px"><div class="row"><b>Story ${i+1}/${data.length}</b><span class="sp"></span><button class="icon-btn" id="story-close">✕</button></div>${x.media_type==='video'?`<video src="${esc(x.media_url)}" controls autoplay playsinline style="width:100%;max-height:65vh;object-fit:contain;border-radius:14px"></video>`:`<img src="${esc(x.media_url)}" alt="Story" style="width:100%;max-height:65vh;object-fit:contain;border-radius:14px">`}<div class="story-reaction-bar" style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0">${counts.map(c=>`<button type="button" class="btn sm ${mine?.reaction===c.emoji?'':'ghost'}" data-story-react="${c.emoji}" aria-label="Réagir ${c.emoji}">${c.emoji} ${c.count||''}</button>`).join('')}</div><div class="row"><button class="btn ghost" id="story-prev" ${i===0?'disabled':''}>Précédente</button><span class="sp"></span><button class="btn" id="story-next">${i===data.length-1?'Terminer':'Suivante'}</button></div></div></div>`;
  $('#story-close').onclick=()=>$('#modal-root').innerHTML='';
  $('#story-prev').onclick=()=>{if(i>0){i--;draw();}};
  $('#story-next').onclick=()=>{if(i<data.length-1){i++;draw();}else $('#modal-root').innerHTML='';};
  $('#story-modal').querySelectorAll('[data-story-react]').forEach(button=>button.addEventListener('click',async()=>{
   const emoji=button.dataset.storyReact,previous=reactions.find(r=>r.story_id===x.id&&r.auteur===state.user.id);
   button.disabled=true;
   if(previous?.reaction===emoji){
    const {error:delError}=await state.client.from('story_reactions').delete().eq('story_id',x.id).eq('auteur',state.user.id);
    if(delError){button.disabled=false;return toast('Réaction non retirée : '+delError.message);}
    reactions.splice(reactions.indexOf(previous),1);
   }else{
    const {error:upsertError}=await state.client.from('story_reactions').upsert({story_id:x.id,auteur:state.user.id,reaction:emoji},{onConflict:'story_id,auteur'});
    if(upsertError){button.disabled=false;return toast('Réaction impossible : '+upsertError.message);}
    if(previous)reactions.splice(reactions.indexOf(previous),1);
    reactions.push({story_id:x.id,auteur:state.user.id,reaction:emoji});
    if(uid!==state.user.id) await createOtakuNotification(uid,'story_reaction',null,x.id);
   }
   draw();
  }));
 };
 draw();
}

async function loadOtakuGroups(){const host=$('#og-list');if(!host)return;const {data,error}=await state.client.from('otaku_groups').select('id,nom,description,createur').order('created_at',{ascending:false}).limit(30);if(error){host.textContent='Groupes indisponibles. Exécute le SQL des nouvelles fonctions dans Paramètres.';return;}if(!data?.length){host.textContent='Aucun groupe pour le moment. Crée le premier !';return;}const {data:members}=await state.client.from('otaku_group_members').select('group_id,membre');host.innerHTML=data.map(g=>{const joined=(members||[]).some(m=>m.group_id===g.id&&m.membre===state.user.id);const count=(members||[]).filter(m=>m.group_id===g.id).length;return `<div class="friend"><div class="meta"><b>${esc(g.nom)}</b><small>${esc(g.description||'Communauté Otaku')} · ${count} membre(s)</small></div>${joined?`<button class="btn sm ghost" data-og-open="${g.id}" data-og-name="${esc(g.nom)}">Ouvrir</button>`:`<button class="btn sm" data-og-join="${g.id}">Rejoindre</button>`}</div>`;}).join('');}

;pending.append(who,content,stamp);body.appendChild(pending);body.scrollTop=body.scrollHeight;input.value='';try{const {error}=await state.client.from('otaku_group_messages').insert({group_id:id,auteur:state.user.id,texte});if(error)throw error;stamp.textContent='Envoyé · à l’instant';}catch(err){pending.remove();input.value=texte;toast('Envoi impossible : '+(err.message||err));}finally{if(btn)btn.disabled=false;input.focus();}};}
async function loadOtakuPolls(){const host=$('#poll-list');if(!host)return;const {data:polls,error}=await state.client.from('otaku_polls').select('id,auteur,question,created_at').order('created_at',{ascending:false}).limit(20);if(error){host.textContent='Sondages indisponibles. Vérifie le SQL des nouvelles fonctions.';return;}if(!polls?.length){host.textContent='Aucun sondage publié.';return;}const ids=polls.map(p=>p.id);const [{data:opts},{data:votes}]=await Promise.all([state.client.from('otaku_poll_options').select('id,poll_id,texte').in('poll_id',ids),state.client.from('otaku_poll_votes').select('poll_id,option_id,votant').in('poll_id',ids)]);host.innerHTML=polls.map(p=>{const oo=(opts||[]).filter(o=>o.poll_id===p.id),vv=(votes||[]).filter(v=>v.poll_id===p.id),mine=vv.find(v=>v.votant===state.user.id);return `<div class="card" style="margin-top:10px"><b>${esc(p.question)}</b>${oo.map(o=>{const n=vv.filter(v=>v.option_id===o.id).length;return `<button class="btn sm ${mine?.option_id===o.id?'':'ghost'}" data-poll-vote="${o.id}" data-poll-id="${p.id}" style="display:flex;width:100%;justify-content:space-between;margin-top:7px" ${mine?'disabled':''}><span>${esc(o.texte)}</span><span>${n} vote(s)</span></button>`;}).join('')}<small style="color:var(--muted)">${vv.length} vote(s) au total</small></div>`;}).join('');}
async function createOtakuPoll(){const question=prompt('Question du sondage :');if(!question?.trim())return;const raw=prompt('Propositions séparées par des virgules (2 à 6) :');if(!raw)return;const options=[...new Set(raw.split(',').map(x=>x.trim()).filter(Boolean))].slice(0,6);if(options.length<2)return toast('Ajoute au moins deux propositions.');const {data,error}=await state.client.from('otaku_polls').insert({auteur:state.user.id,question:question.trim()}).select('id').single();if(error)return toast('Sondage impossible : '+error.message);const {error:oe}=await state.client.from('otaku_poll_options').insert(options.map(texte=>({poll_id:data.id,texte})));if(oe)return toast('Question créée, options non enregistrées : '+oe.message);toast('Sondage publié !');loadOtakuPolls();}

   Cette couche s'ajoute aux écrans existants sans remplacer leurs fonctions. */
const _buildChromeOriginal = buildChrome;
buildChrome = function(){
  _buildChromeOriginal();
  if(!$('#global-toolbar')){
    const bar=document.createElement('header');
    bar.id='global-toolbar';
    bar.innerHTML=`<div class="gt-brand">⛩️ Otaku<span>Link</span></div>
      <div class="gt-sp"></div>
      <button class="gt-action" id="global-search" aria-label="Rechercher">⌕</button>
      <button class="gt-action" id="global-notifications" aria-label="Notifications">♧<span class="gt-dot" id="global-notif-count" hidden></span></button>
      <button class="gt-action" id="global-account" aria-label="Mon profil">👤</button>`;
    $('#main').insertBefore(bar,$('#screens'));
    $('#global-search').addEventListener('click',openGlobalSearch);
    $('#global-notifications').addEventListener('click',openGlobalNotifications);
    $('#global-account').addEventListener('click',()=>{state.viewedProfile=null;go('profil');});
  }
};

function openGlobalSearch(){
  $('#modal-root').innerHTML=`<div class="modal" id="quick-search-modal"><div class="sheet">
    <div class="row"><h3>🔎 Recherche OtakuLink</h3><span class="sp"></span><button class="icon-btn" id="quick-search-close">✕</button></div>

    <div class="chips"><button class="chip" data-search-preset="Naruto">Naruto</button><button class="chip" data-search-preset="One Piece">One Piece</button><button class="chip" data-search-preset="Demon Slayer">Demon Slayer</button><button class="chip" data-search-preset="Manga">Manga</button></div>
  </div></div>`;
  $('#quick-search-close').onclick=()=>$('#modal-root').innerHTML='';
  $('#quick-search-form').onsubmit=e=>{e.preventDefault();state.query=$('#quick-search-input').value.trim();$('#modal-root').innerHTML='';go('decouvrir');};

async function refreshGlobalNotificationCount(){
  if(!state.client||!state.user)return;
  const {count,error}=await state.client.from('notifications').select('id',{count:'exact',head:true}).eq('lu',false);
  if(error)return;
  const badge=$('#global-notif-count');
  if(badge){const n=count||0;badge.hidden=!n;badge.textContent=n>9?'9+':String(n);}
}
async function openGlobalNotifications(){
  if(!state.client||!state.user)return toast('Connecte-toi pour voir tes notifications.');
  $('#modal-root').innerHTML=`<div class="modal" id="quick-notif-modal"><div class="sheet">
    <div class="row"><h3>🔔 Notifications</h3><span class="sp"></span><button class="icon-btn" id="quick-notif-close">✕</button></div>
    <div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn sm ghost" id="quick-notif-all-read">Tout marquer comme lu</button></div><div id="quick-notif-list" style="margin-top:10px">Chargement…</div>
  </div></div>`;
  $('#quick-notif-close').onclick=()=>$('#modal-root').innerHTML='';
  $('#quick-notif-all-read').onclick=async()=>{const {error}=await state.client.from('notifications').update({lu:true}).eq('lu',false);if(error){toast('Impossible de mettre à jour les notifications.');return;}toast('Toutes les notifications sont marquées comme lues.');await refreshGlobalNotificationCount();await openGlobalNotifications();};
  const host=$('#quick-notif-list');
  const {data,error}=await state.client.from('notifications').select('id,acteur,type,post_id,story_id,lu,created_at').order('created_at',{ascending:false}).limit(40);
  if(error){host.textContent='Notifications indisponibles. Vérifie la table notifications et ses règles SQL.';return;}
  const rows=data||[];
  await fetchProfiles(rows.map(x=>x.acteur));
  const unread=rows.filter(x=>!x.lu).length;
  const badge=$('#global-notif-count');if(badge){badge.hidden=!unread;badge.textContent=unread>9?'9+':String(unread);}
  host.innerHTML=rows.length?rows.map(n=>{
    const u=state.users.find(x=>x.id===n.acteur);
    const icon=n.type==='like'?'❤️':n.type==='comment'?'💬':n.type==='match'?'🎉':n.type==='follow'?'➕':n.type==='story_reaction'?'✨':'🔔';
    const label=n.type==='match'?'— 🎉 Félicitations ! C’est réciproque, vous pouvez discuter.':n.type==='like'?'a aimé ta publication':n.type==='comment'?'a commenté ta publication':n.type==='follow'?'a commencé à te suivre':n.type==='story_reaction'?'a réagi à ta Story':'a interagi avec toi';
    return `<button class="quick-result" data-global-notif-read="${n.id}" style="width:100%;text-align:left;background:${n.lu?'transparent':'rgba(0,210,255,.09)'}">
      <span style="font-size:22px">${icon}</span><span class="meta"><b>${esc(u?.pseudo||'Un membre')}</b><small>${label} · ${fmtDate(n.created_at)}</small></span>${n.lu?'':'<span class="badge">Nouveau</span>'}
    </button>`;
  }).join(''):'<div class="card" style="text-align:center">Tu n’as pas encore de notification.</div>';
}
document.addEventListener('click',async e=>{
  const preset=e.target.closest('[data-search-preset]');
  if(preset){state.query=preset.dataset.searchPreset;$('#modal-root').innerHTML='';go('decouvrir');return;}
  const n=e.target.closest('[data-global-notif-read]');
  if(n&&state.client){const {error}=await state.client.from('notifications').update({lu:true}).eq('id',n.dataset.globalNotifRead);if(error)toast('Impossible de marquer cette notification.');else{n.style.opacity='.55';n.querySelector('.badge')?.remove();await refreshGlobalNotificationCount();}}
});
const _renderDiscoverOriginal=render.decouvrir;
render.decouvrir=async()=>{
  await _renderDiscoverOriginal();
  const screen=$('#s-decouvrir');
  if(!screen||!state.client||$('#discover-stories'))return;
  const card=document.createElement('div');card.className='card global-story-card';card.id='discover-stories';
  card.innerHTML=`<div class="row"><h3>✨ Stories</h3><span class="sp"></span><button class="btn sm ghost" id="discover-add-story">＋ Ajouter</button></div><div id="discover-stories-tray" class="stories"></div>`;
  const anchor=screen.querySelector('.searchbar');
  if(anchor)anchor.insertAdjacentElement('afterend',card);else screen.prepend(card);
  // Réutilise le chargement de stories existant sans toucher à celui de Communauté.
  const {data,error}=await state.client.from('stories').select('id,auteur,created_at').gt('created_at',new Date(Date.now()-86400000).toISOString()).order('created_at',{ascending:false}).limit(80);
  const tray=$('#discover-stories-tray');
  if(error){tray.innerHTML='<small style="color:var(--muted)">Stories indisponibles pour le moment.</small>';return;}
  const rows=data||[];await fetchProfiles(rows.map(x=>x.auteur));
  const authors=[...new Set([state.user.id,...rows.map(x=>x.auteur)])];
  tray.innerHTML=`<button class="story add" data-story-new="1"><span class="av">＋</span><span>Ma story</span></button>`+authors.filter(id=>id!==state.user.id).map(id=>{
    const u=state.users.find(x=>x.id===id);return u?`<button class="story" data-story-view="${id}">${avatar(u)}<span>${esc(u.pseudo||'Membre')}</span></button>`:'';
  }).join('');
  $('#discover-add-story').onclick=openStoryComposer;
};
const _initOriginal=init;

  if($('#app')&&!$('#app').classList.contains('hidden')&&!$('#global-toolbar'))buildChrome();

/* === Recadrage de l'avatar : déplacement + zoom avant téléversement === */
let otakuCropState=null;
function closeOtakuCrop(){const modal=document.getElementById('otaku-crop-modal');if(modal)modal.remove();if(otakuCropState?.url)URL.revokeObjectURL(otakuCropState.url);otakuCropState=null;}
function drawOtakuCrop(){const st=otakuCropState;if(!st)return;const c=st.canvas,ctx=c.getContext('2d'),size=c.width;ctx.clearRect(0,0,size,size);ctx.fillStyle='#071127';ctx.fillRect(0,0,size,size);const scale=Math.max(size/st.img.naturalWidth,size/st.img.naturalHeight)*st.zoom;const w=st.img.naturalWidth*scale,h=st.img.naturalHeight*scale;st.x=Math.min(0,Math.max(size-w,st.x));st.y=Math.min(0,Math.max(size-h,st.y));ctx.drawImage(st.img,st.x,st.y,w,h);}
function openOtakuCrop(file,input){const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const modal=document.createElement('div');modal.id='otaku-crop-modal';modal.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(2,6,23,.96);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto';modal.innerHTML='<div style="width:min(100%,390px);background:#0c1735;border:1px solid #245078;border-radius:20px;padding:18px;color:#fff;text-align:center"><h3 style="margin:0 0 8px">Ajuster ta photo</h3><p style="font-size:13px;color:#a9b8d4;margin:0 0 14px">Fais glisser la photo et règle le zoom.</p><canvas id="otaku-crop-canvas" width="280" height="280" style="width:min(100%,280px);aspect-ratio:1;border-radius:50%;border:3px solid #00dfff;touch-action:none;cursor:grab;background:#071127"></canvas><label style="display:block;text-align:left;margin:16px 0 6px;font-size:13px">Zoom <input id="otaku-crop-zoom" type="range" min="1" max="3" step="0.01" value="1" style="width:100%"></label><div style="display:flex;gap:10px;margin-top:14px"><button type="button" id="otaku-crop-cancel" class="btn ghost" style="flex:1">Annuler</button><button type="button" id="otaku-crop-apply" class="btn" style="flex:1">Utiliser cette photo</button></div></div>';document.body.appendChild(modal);const canvas=modal.querySelector('canvas'),size=canvas.width,base=Math.max(size/img.naturalWidth,size/img.naturalHeight);otakuCropState={img,url,input,canvas,zoom:1,x:(size-img.naturalWidth*base)/2,y:(size-img.naturalHeight*base)/2,base};drawOtakuCrop();modal.querySelector('#otaku-crop-zoom').oninput=e=>{const st=otakuCropState,old=st.zoom;const center=size/2;st.x=center-(center-st.x)*(Number(e.target.value)/old);st.y=center-(center-st.y)*(Number(e.target.value)/old);st.zoom=Number(e.target.value);drawOtakuCrop();};let drag=null;canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:otakuCropState.x,oy:otakuCropState.y};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;const r=canvas.getBoundingClientRect(),k=size/r.width;otakuCropState.x=drag.ox+(e.clientX-drag.x)*k;otakuCropState.y=drag.oy+(e.clientY-drag.y)*k;drawOtakuCrop();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;modal.querySelector('#otaku-crop-cancel').onclick=()=>{input.value='';closeOtakuCrop();};modal.querySelector('#otaku-crop-apply').onclick=()=>{const st=otakuCropState,out=document.createElement('canvas');out.width=out.height=512;const ctx=out.getContext('2d'),factor=512/size,scale=st.base*st.zoom;ctx.drawImage(st.img,st.x*factor,st.y*factor,st.img.naturalWidth*scale*factor,st.img.naturalHeight*scale*factor);out.toBlob(blob=>{if(!blob){toast('Impossible de préparer cette photo.');return;}const cropped=new File([blob],(file.name.replace(/\.[^.]+$/,'')||'avatar')+'-recadree.jpg',{type:'image/jpeg'});const transfer=new DataTransfer();transfer.items.add(cropped);input.files=transfer.files;const label=input.closest('label');if(label){let note=label.querySelector('.crop-ready');if(!note){note=document.createElement('small');note.className='crop-ready';note.style.cssText='display:block;color:#00dfff;margin-top:6px';label.appendChild(note);}note.textContent='✓ Photo recadrée et prête à enregistrer';}closeOtakuCrop();},'image/jpeg',.9);};};img.onerror=()=>{URL.revokeObjectURL(url);toast('Impossible de lire cette image.');};img.src=url;}
document.addEventListener('change',e=>{const input=e.target.closest('#profile-form input[name="avatar_file"]');if(!input)return;const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){input.value='';toast('Choisis un fichier image.');return;}if(file.size>15*1024*1024){input.value='';toast('La photo doit faire moins de 15 Mo.');return;}openOtakuCrop(file,input);});

    if(tab==='activity')return `<div id="ol-activity-content"><p style="color:var(--muted)">Chargement de l’activité…</p></div>`;

    const extra=document.createElement('section');extra.id='ol-profile-extra';extra.innerHTML=`

      if(tab==='activity'){
        const {data,error}=await state.client.from('posts').select('id,texte,created_at').eq('auteur',p.id).order('created_at',{ascending:false}).limit(8);
        $('#ol-activity-content').innerHTML=error?'<p style="color:var(--muted)">Activité indisponible pour le moment.</p>':data?.length?data.map(x=>`<div class="comment"><p>${esc(x.texte||'Publication')}</p><small>${fmtDate(x.created_at)}</small></div>`).join(''):'<p style="color:var(--muted)">Aucune activité récente.</p>';
      }
    };
    extra.addEventListener('click',e=>{const b=e.target.closest('[data-profile-tab]');if(b)showTab(b.dataset.profileTab);});
  };

  async function loadRealTrends(host){
    if(!host||!state.client)return;
    const since=new Date(Date.now()-30*86400000).toISOString();
    const {data,error}=await state.client.from('posts').select('texte,created_at').gte('created_at',since).order('created_at',{ascending:false}).limit(300);
    if(error){host.innerHTML='<small style="color:var(--muted)">Les tendances ne sont pas disponibles pour le moment.</small>';return;}
    const posts=data||[],tags=new Map(),animeNames=['Naruto','One Piece','Demon Slayer','Attack on Titan','Jujutsu Kaisen','Dragon Ball','Bleach','My Hero Academia','Spy x Family','Frieren','Chainsaw Man','Hunter x Hunter','Black Clover','Solo Leveling','Tokyo Revengers','Haikyuu'];
    posts.forEach(post=>{
      const text=String(post.texte||'');
      for(const match of text.matchAll(/#([\p{L}\p{N}_-]{2,30})/gu)){const key=match[1].toLowerCase();tags.set('#'+key,(tags.get('#'+key)||0)+1);}
      animeNames.forEach(name=>{if(text.toLowerCase().includes(name.toLowerCase()))tags.set(name,(tags.get(name)||0)+1);});
    });
    const ranked=[...tags.entries()].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
    host.innerHTML=ranked.length?ranked.map(([name,count],i)=>`<button class="ol-trend" data-search-preset="${esc(name.replace(/^#/,''))}" style="width:100%;text-align:left"><span class="rank">${i+1}</span><span class="meta"><b>${esc(name)}</b><small>${count} mention(s) dans les publications récentes</small></span><span>↗</span></button>`).join(''):`<p style="color:var(--muted)">${posts.length?'Aucun hashtag ou anime assez mentionné pour établir une tendance.':'Les tendances apparaîtront quand la communauté publiera.'}</p>`;
  }
  const oldDiscover=render.decouvrir;
  render.decouvrir=async function(){
    await oldDiscover();const screen=$('#s-decouvrir');if(!screen||!state.client||$('#ol-trends'))return;
    const card=document.createElement('div');card.className='card';card.id='ol-trends';card.innerHTML='<div class="row"><h3>🔥 Tendances Otaku</h3><span class="sp"></span><small style="color:var(--muted)">30 derniers jours</small></div><div id="ol-trend-list"><small style="color:var(--muted)">Analyse des publications…</small></div>';
    const anchor=$('#discover-stories')||screen.querySelector('.searchbar');if(anchor)anchor.insertAdjacentElement('afterend',card);else screen.appendChild(card);
    await loadRealTrends($('#ol-trend-list'));
  };
})();

/* ===== OtakuLink PLUS : catalogue, progression, quiz, événements et cartes =====
   Stockage local de secours + synchronisation Supabase quand la migration Otaku+ est installée. */
const OT_PLUS_KEY='otakulink_plus_v1';
const otPlusDefaults=()=>({xp:0,claimed:[],quizDays:[],theme:'blue',frame:'cyan',favorites:[],favoriteXpIds:[],quizBest:0,events:[]});
const otPlusLoad=()=>{try{return JSON.parse(localStorage.getItem(OT_PLUS_KEY)||'{}')}catch(_){return {}}};
const otPlusSave=v=>{try{localStorage.setItem(OT_PLUS_KEY,JSON.stringify(v));return true}catch(_){toast('Stockage local indisponible.');return false}};
const otPlusUser=()=>state.user?.id||'guest';
const otPlusData=()=>{const all=otPlusLoad(),d={...otPlusDefaults(),...(all[otPlusUser()]||{})};if(opServerXp!==null)d.xp=opServerXp;return d};
let opCloudReadyUser=null,opCloudAvailable=false,opCloudMessage='',opServerXp=null;
const otPlusSet=d=>{const all=otPlusLoad();all[otPlusUser()]={...otPlusDefaults(),...d};otPlusSave(all);if(state.client&&state.user)opCloudSave(all[otPlusUser()]);};
async function opCloudSave(d){try{const {error}=await state.client.from('otaku_plus_profiles').upsert({user_id:state.user.id,data:d,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;opCloudAvailable=true;opCloudMessage='Synchronisé avec ton compte';}catch(e){opCloudAvailable=false;opCloudMessage='Mode local · migration SQL à installer';console.warn('Otaku+ cloud save:',e.message)}}
async function opCloudLoad(){if(!state.client||!state.user)return;try{const {data,error}=await state.client.from('otaku_plus_profiles').select('data').eq('user_id',state.user.id).maybeSingle();if(error)throw error;const all=otPlusLoad(),local=otPlusData();if(data?.data){const merged={...local,...data.data};all[state.user.id]=merged;otPlusSave(all);}else{await opCloudSave(local);}opCloudAvailable=true;opCloudMessage='Synchronisé avec ton compte';}catch(e){opCloudAvailable=false;opCloudMessage='Mode local · migration SQL à installer';console.warn('Otaku+ cloud load:',e.message)}try{const {data:xpRow,error:xpError}=await state.client.from('otaku_plus_xp').select('xp').eq('user_id',state.user.id).maybeSingle();if(xpError)throw xpError;opServerXp=Number(xpRow?.xp)||0;}catch(e){opServerXp=null;opCloudMessage='Profil synchronisé, mais classement XP inaccessible : '+(e.message||'vérifie les droits SQL');console.warn('Otaku+ XP load:',e.message)}opCloudReadyUser=state.user.id;}

-- XP sécurisés : le client ne choisit jamais le montant
create table if not exists public.otaku_plus_xp (
 user_id uuid primary key references auth.users(id) on delete cascade,

);
alter table public.otaku_plus_xp_awards enable row level security;
revoke all on public.otaku_plus_xp_awards from anon, authenticated;
create or replace function public.otaku_plus_award_xp(p_reward text)
returns integer language plpgsql security definer set search_path = public, pg_temp as $$
declare v_user uuid := auth.uid(); v_key text; v_amount integer;
begin
 if v_user is null then raise exception 'Tu dois être connecté.'; end if;
 if p_reward = 'daily_mission' then v_amount := 10; v_key := 'daily_mission:' || current_date::text;
 elsif p_reward = 'profile_mission' then
  if not exists(select 1 from public.profiles where id=v_user and coalesce(trim(bio),'')<>'' and coalesce(trim(animes_favoris),'')<>'') then raise exception 'Complète ta bio et tes animes favoris dans ton profil.'; end if;
  v_amount := 30; v_key := 'profile_mission';
 elsif p_reward = 'catalog_mission' then
  if not exists(select 1 from public.otaku_plus_profiles where user_id=v_user and jsonb_array_length(case when jsonb_typeof(data->'favorites')='array' then data->'favorites' else '[]'::jsonb end)>0) then raise exception 'Ajoute une œuvre à ta collection.'; end if;
  v_amount := 15; v_key := 'catalog_mission:' || current_date::text;
 elsif p_reward = 'quiz_mission' then
  if not exists(select 1 from public.otaku_plus_xp_awards where user_id=v_user and award_key='quiz_complete:' || current_date::text) then raise exception 'Termine le quiz du jour.'; end if;
  v_amount := 25; v_key := 'quiz_mission:' || current_date::text;
 elsif p_reward = 'quiz_complete' then v_amount := 20; v_key := 'quiz_complete:' || current_date::text;
 elsif p_reward = 'favorite_add' then v_amount := 5; v_key := 'favorite_add:' || current_date::text;
 else raise exception 'Récompense inconnue : %', p_reward; end if;
 insert into public.otaku_plus_xp_awards(user_id, award_key) values(v_user, v_key) on conflict(user_id, award_key) do nothing;
 if not found then return 0; end if;
 insert into public.otaku_plus_xp(user_id,xp,updated_at) values(v_user,v_amount,now())
 on conflict(user_id) do update set xp=public.otaku_plus_xp.xp + excluded.xp, updated_at=now();
 return v_amount;
end; $$;
revoke all on function public.otaku_plus_award_xp(text) from public, anon;
grant execute on function public.otaku_plus_award_xp(text) to authenticated;

function warmOtakuScreens(){
 if(!state.client||!state.user)return;
 const work=async()=>{
  for(const route of ['decouvrir','communaute']){
   if(state.route===route)continue;
   if(state.routeCache[route]&&Date.now()-state.routeCache[route]<30000)continue;
   try{await render[route]?.();const el=$('#s-'+route);if(el){el.dataset.loaded='true';state.routeCache[route]=Date.now();}}
   catch(err){console.warn('Préchargement '+route,err);}
  }
 };
 if(window.requestIdleCallback)requestIdleCallback(work,{timeout:1800});else setTimeout(work,1000);
}

go=function(route){_goWithWarmup(route);if(route==='decouvrir'||route==='communaute')warmOtakuScreens();};

     if(!response.ok)throw new Error('download');
     const blob=await response.blob(), objectUrl=URL.createObjectURL(blob);
     const a=document.createElement('a');a.href=objectUrl;a.download=currentName||('otakulink-media.'+(currentKind==='video'?'mp4':'jpg'));
     document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(objectUrl),1500);
     btn.textContent='✓ Téléchargé';
   }catch(_){
     const a=document.createElement('a');a.href=currentUrl;a.target='_blank';a.rel='noopener';a.download=currentName||'otakulink-media';a.click();
     btn.textContent='Ouvrir le média';
   }finally{setTimeout(()=>{btn.disabled=false;btn.textContent='⬇ Télécharger';},1800);}
 }
 document.addEventListener('click',e=>{
   const view=e.target.closest('[data-chat-view]');
   if(view){openMedia(view.dataset.chatView,view.dataset.kind,view.dataset.name);return;}
   const dl=e.target.closest('[data-chat-download]');
   if(dl){openMedia(dl.dataset.chatDownload,dl.dataset.kind,dl.dataset.name);downloadCurrent();return;}
   if(e.target===viewer||e.target.closest('#chat-viewer-close'))close();
   if(e.target.closest('#chat-viewer-download'))downloadCurrent();
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
})();
</script>
<script id="ol-extras">
/* ===== OtakuLink : ajouts repris de l'ancienne maquette (mot de passe, tags, sujets, groupes, stats, onglets) ===== */
(function(){
const Q=(s,r=document)=>r.querySelector(s), QA=(s,r=document)=>[...r.querySelectorAll(s)];
function after(obj,name,fn){const o=obj[name];if(!o)return;obj[name]=async function(){const r=await o.apply(this,arguments);try{await fn.apply(this,arguments);}catch(e){console.error(e);}return r;};}
const card=(id,html)=>{const c=document.createElement("div");c.className="card";c.id=id;c.innerHTML=html;return c;};

/* 2) Tags dans la création de publication */
const _oc=openComposer;
openComposer=function(){
  _oc.apply(this,arguments);
  const t=Q("#m-text");if(!t||Q("#ol-tags"))return;
  const d=document.createElement("div");d.id="ol-tags";d.className="chips";d.style.marginTop="8px";
  d.innerHTML=["Anime","Manga","Gaming","Cosplay","OtakuLife"].map(x=>`<button type="button" class="chip" data-tag="#${x}">#${x}</button>`).join("");
  t.insertAdjacentElement("afterend",d);
  d.onclick=e=>{const b=e.target.closest("[data-tag]");if(!b)return;t.value=(t.value+" "+b.dataset.tag).trim();t.dispatchEvent(new Event("input"));t.focus();};
};

/* 1) + 6) Paramètres : mot de passe + onglets Compte / Sécurité / Aide */
let curTab="compte";
after(render,"parametres",async()=>{
  const root=Q("#s-parametres");if(!root||Q("#ol-tabs"))return;
  const col=Q(".two-col > div:first-child",root);
  if(col&&state.client&&!Q("#ol-pw-card")){
    col.appendChild(card("ol-pw-card",`<h3>🔑 Mot de passe</h3><label>Nouveau mot de passe<input id="ol-pw1" type="password" autocomplete="new-password"></label><label>Confirmer le mot de passe<input id="ol-pw2" type="password" autocomplete="new-password"></label><button class="btn sm" id="ol-pw-btn" type="button" style="margin-top:10px">Changer le mot de passe</button>`));
    Q("#ol-pw-btn").onclick=async()=>{
      const a=Q("#ol-pw1").value,b=Q("#ol-pw2").value;
      if(a.length<8)return toast("Le mot de passe doit contenir au moins 8 caractères.");
      if(a!==b)return toast("Les deux mots de passe ne sont pas identiques.");
      const btn=Q("#ol-pw-btn");btn.disabled=true;
      const {error}=await state.client.auth.updateUser({password:a});
      btn.disabled=false;
      if(error)return toast("Impossible de changer le mot de passe : "+error.message);
      Q("#ol-pw1").value=Q("#ol-pw2").value="";toast("Mot de passe modifié ✅");
    };
  }
  const tabOf=c=>{const h=Q("h3",c)?.textContent||"";
    if(/Mode d|Pourquoi|propos/.test(h))return "aide";
    if(/bloqu|Zone de s|Mot de passe/.test(h))return "securite";
    return "compte";};
  const bar=document.createElement("div");bar.id="ol-tabs";bar.className="chips";bar.style.margin="0 0 12px";
  bar.innerHTML=[["compte","Compte"],["securite","Sécurité"],["aide","Aide"]].map(x=>`<button type="button" class="chip" data-t="${x[0]}">${x[1]}</button>`).join("");
  const grid=Q(".two-col",root);grid.parentNode.insertBefore(bar,grid);
  const apply=()=>{QA(".card",grid).forEach(c=>{c.style.display=tabOf(c)===curTab?"":"none";});
    QA("[data-t]",bar).forEach(b=>{const on=b.dataset.t===curTab;b.classList.toggle("active",on);b.style.borderColor=on?"var(--cyan)":"";b.style.color=on?"var(--cyan)":"";});};
  bar.onclick=e=>{const b=e.target.closest("[data-t]");if(b){curTab=b.dataset.t;apply();}};
  apply();
});

/* 5) Statistiques du profil (chiffres réels) */
after(render,"profil",async()=>{
  const root=Q("#s-profil"),p=state.viewedProfile||state.profile;if(!root||!p?.id||!state.client)return;
  Q("#ol-stats")?.remove();
  const cnt=async(t,f)=>{const {count}=await f(state.client.from(t).select("*",{count:"exact",head:true}));return count??0;};
  const mine=p.id===state.user?.id;
  const [posts,fol,sub,friends]=await Promise.all([
    cnt("posts",q=>q.eq("auteur",p.id)),cnt("abonnements",q=>q.eq("a",p.id)),cnt("abonnements",q=>q.eq("de",p.id)),
    mine?cnt("amis",q=>q.eq("statut","ami").or(`de.eq.${p.id},a.eq.${p.id}`)):Promise.resolve(null)]);
  const days=p.created_at?Math.max(1,Math.ceil((Date.now()-new Date(p.created_at))/864e5)):null;
  const s=[[posts,"Publications"],[fol,"Abonnés"],[sub,"Abonnements"]];
  if(friends!==null)s.push([friends,"Amis"]);if(days)s.push([days,"Jours sur OtakuLink"]);
  root.appendChild(card("ol-stats",`<h3>Statistiques</h3><div class="stats">${s.map(x=>`<div class="stat"><b>${x[0]}</b><small>${x[1]}</small></div>`).join("")}</div>`));
});

/* 3) + 4) Découvrir : sujets populaires et groupes recommandés (données réelles) */
async function showTag(tag){
  const {data}=await state.client.from("posts").select("texte,created_at").ilike("texte","%"+tag+"%").order("created_at",{ascending:false}).limit(10);
  Q("#modal-root").innerHTML=`<div class="modal" id="modal"><div class="sheet"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button class="icon-btn" id="m-close" type="button">←</button><h3 style="flex:1">${esc(tag)}</h3></div>${(data||[]).map(p=>`<div class="card"><p>${esc(String(p.texte||"").slice(0,300))}</p><small style="color:var(--muted)">${new Date(p.created_at).toLocaleDateString("fr-FR")}</small></div>`).join("")||"<small style=\"color:var(--muted)\">Aucune publication pour ce sujet.</small>"}</div></div>`;
  const close=()=>{Q("#modal-root").innerHTML="";};Q("#m-close").onclick=close;Q("#modal").onclick=e=>{if(e.target.id==="modal")close();};
}
async function topicsCard(screen){
  Q("#ol-topics")?.remove();
  const since=new Date(Date.now()-30*864e5).toISOString();
  const {data,error}=await state.client.from("posts").select("texte").gte("created_at",since).limit(300);
  if(error)return;
  const n={};(data||[]).forEach(p=>(String(p.texte||"").match(/#[\p{L}\p{N}_]{2,30}/gu)||[]).forEach(t=>{const k=t.toLowerCase();n[k]=(n[k]||0)+1;}));
  const top=Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const c=card("ol-topics",`<h3>Sujets populaires</h3>${top.length?top.map(x=>`<button type="button" class="chip" data-topic="${esc(x[0])}">${esc(x[0])} · ${x[1]}</button>`).join(" "):"<small style=\"color:var(--muted)\">Aucun sujet pour le moment. Ajoute des #tags à tes publications !</small>"}`);
  c.onclick=e=>{const b=e.target.closest("[data-topic]");if(b)showTag(b.dataset.topic);};
  screen.appendChild(c);
}
async function groupsCard(screen){
  Q("#ol-groups")?.remove();
  const {data:gs,error}=await state.client.from("otaku_groups").select("id,nom,description").order("created_at",{ascending:false}).limit(30);
  if(error||!gs?.length)return;
  const {data:ms}=await state.client.from("otaku_group_members").select("group_id,membre");
  const rows=gs.map(g=>({g,n:(ms||[]).filter(m=>m.group_id===g.id).length,joined:(ms||[]).some(m=>m.group_id===g.id&&m.membre===state.user.id)})).sort((a,b)=>b.n-a.n).slice(0,3);
  const c=card("ol-groups",`<h3>Groupes recommandés</h3>${rows.map(r=>`<div class="friend"><div class="meta"><b>${esc(r.g.nom)}</b><small>${r.n} membre(s)</small></div>${r.joined?"<small style=\"color:var(--muted)\">Membre ✓</small>":`<button class="btn sm" type="button" data-join-group="${r.g.id}">Rejoindre</button>`}</div>`).join("")}`);
  c.onclick=async e=>{const b=e.target.closest("[data-join-group]");if(!b)return;b.disabled=true;
    const {error}=await state.client.from("otaku_group_members").insert({group_id:b.dataset.joinGroup,membre:state.user.id});
    if(error){b.disabled=false;return toast("Impossible de rejoindre ce groupe : "+error.message);}
    toast("Tu as rejoint le groupe ✅");groupsCard(screen);};
  screen.appendChild(c);
}
after(render,"decouvrir",async()=>{
  const s=Q("#s-decouvrir");if(!s||!state.client||!state.user)return;
  await topicsCard(s);await groupsCard(s);
});
})();
</script>
<script id="ol-media-posts">
/* Agrandir / télécharger les médias des publications (en arrière-plan, sans rechargement) */
(function(){
const st=document.createElement("style");
st.textContent=".ol-media{position:relative;display:block;line-height:0}.ol-media>.post-media,.ol-media>img,.ol-media>video{display:block}.ol-media>img{cursor:zoom-in}.ol-media-actions{position:absolute;right:8px;top:8px;display:flex;gap:6px;line-height:1}.ol-media-actions button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:16px;padding:0}";
document.head.appendChild(st);
const SEL=".post-media,.group-message img,.group-message video";
const nameOf=u=>{try{return decodeURIComponent(u.split("?")[0].split("/").pop())||"otakulink-media";}catch(_){return "otakulink-media";}};
function decorate(){
  document.querySelectorAll(SEL).forEach(m=>{
    if(m.closest(".ol-media"))return;
    const url=m.currentSrc||m.getAttribute("src");if(!url)return;
    const kind=m.tagName==="VIDEO"?"video":"image",name=nameOf(url),u=esc(url),nm=esc(name);
    const w=document.createElement("span");w.className="ol-media";
    m.parentNode.insertBefore(w,m);w.appendChild(m);
    if(kind==="image"){m.setAttribute("data-chat-view",url);m.dataset.kind="image";m.dataset.name=name;}
    const a=document.createElement("span");a.className="ol-media-actions";
    a.innerHTML=`<button type="button" data-chat-view="${u}" data-kind="${kind}" data-name="${nm}" aria-label="Agrandir">⤢</button><button type="button" data-ol-dl="${u}" data-name="${nm}" aria-label="Télécharger">⬇</button>`;
    w.appendChild(a);
  });
}
let raf=0;
new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(decorate);}).observe(document.body,{childList:true,subtree:true});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-ol-dl]");if(!b)return;
  e.preventDefault();e.stopPropagation();
  if(b.dataset.busy)return;b.dataset.busy="1";const old=b.textContent;b.textContent="…";
  const url=b.dataset.olDl,name=b.dataset.name||"otakulink-media";
  try{
    const r=await fetch(url);if(!r.ok)throw new Error("dl");
    const blob=await r.blob(),o=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=o;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(o),1500);
    b.textContent="✓";
  }catch(_){
    const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.download=name;a.click();b.textContent="↗";
  }
  setTimeout(()=>{b.textContent=old;delete b.dataset.busy;},1500);
},true);
decorate();
})();
</script>
